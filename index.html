<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>☕ مقهى الأفكار - واحد + واحد = مليون</title>
<meta name="description" content="فكرتك ببلاش… نشرها بـ9 جنيه. واحد + واحد = مليون.">
<meta name="theme-color" content="#4285F4">
<link rel="icon" type="image/png" href="icon.png">
<link rel="apple-touch-icon" href="icon.png">
<link rel="manifest" href="manifest.json">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="مقهى الأفكار">

<style>
  /* ========== المتغيرات ========== */
  :root {
    --blue: #4285F4;
    --green: #34A853;
    --yellow: #FBBC04;
    --orange: #FF6D00;
    --pink: #FF4FCB;
    --bg: #FAFAFA;
    --bg-soft: #F5F5F7;
    --white: #FFFFFF;
    --border: #E5E7EB;
    --text: #1C1C1E;
    --text-soft: #8E8E8E;
    --text-mid: #4B5563;
    --shadow: 0 1px 3px rgba(0,0,0,.05), 0 1px 2px rgba(0,0,0,.03);
    --radius: 16px;
  }

  * {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
  }

  html, body {
    margin: 0;
    padding: 0;
    background: var(--bg);
  }

  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Tahoma, Arial, sans-serif;
    color: var(--text);
    direction: rtl;
    text-align: right;
    line-height: 1.6;
    min-height: 100vh;
    padding-bottom: 90px;
    font-size: 15px;
  }

  a { color: var(--blue); text-decoration: none; }
  button { font-family: inherit; cursor: pointer; border: none; background: none; color: inherit; }
  img { max-width: 100%; display: block; }

  /* ========== الهيدر ========== */
  .app-header {
    background: var(--white);
    border-bottom: 1px solid var(--border);
    padding: 12px 16px;
    position: sticky;
    top: 0;
    z-index: 40;
  }
  .header-row {
    max-width: 640px;
    margin: 0 auto;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
  }
  .logo-box {
    width: 40px;
    height: 40px;
    border-radius: 10px;
    overflow: hidden;
    flex-shrink: 0;
  }
  .logo-box img { width: 100%; height: 100%; }
  .brand-title {
    font-size: 1.15rem;
    font-weight: 800;
    color: var(--text);
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .header-icon {
    width: 40px;
    height: 40px;
    border-radius: 50%;
    background: var(--bg-soft);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 1.1rem;
  }

  /* ========== الحاوية ========== */
  .wrap {
    max-width: 640px;
    margin: 0 auto;
    padding: 0 16px;
  }

  /* ========== الهيرو ========== */
  .hero {
    text-align: center;
    padding: 32px 0 24px;
  }
  .hero h1 {
    font-size: 1.7rem;
    font-weight: 900;
    color: var(--text);
    margin: 0 0 10px;
    line-height: 1.3;
  }
  .hero p {
    font-size: 0.98rem;
    color: var(--text-mid);
    margin: 0 0 16px;
  }
  .badge-gradient {
    display: inline-block;
    background: linear-gradient(135deg, var(--yellow), var(--orange));
    color: var(--white);
    padding: 8px 22px;
    border-radius: 24px;
    font-weight: 800;
    font-size: 0.95rem;
    box-shadow: 0 4px 12px rgba(255,109,0,.25);
  }

  /* ========== الأزرار الرئيسية ========== */
  .main-actions {
    display: flex;
    gap: 10px;
    margin: 20px 0;
  }
  .btn {
    flex: 1;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    padding: 14px 18px;
    border-radius: 14px;
    font-size: 1rem;
    font-weight: 800;
    transition: transform .08s ease;
  }
  .btn:active { transform: scale(.97); }
  .btn-primary {
    background: linear-gradient(135deg, var(--blue), #2b6fd9);
    color: var(--white);
    box-shadow: 0 4px 12px rgba(66,133,244,.25);
  }
  .btn-secondary {
    background: var(--white);
    color: var(--text);
    border: 1.5px solid var(--border);
  }
  .btn-block { width: 100%; }

  /* ========== الإحصائيات ========== */
  .stats {
    display: flex;
    gap: 10px;
    margin: 16px 0;
  }
  .stat {
    flex: 1;
    background: var(--white);
    border-radius: var(--radius);
    padding: 14px 10px;
    text-align: center;
    box-shadow: var(--shadow);
    border: 1px solid var(--border);
  }
  .stat .num {
    font-size: 1.5rem;
    font-weight: 900;
    color: var(--blue);
  }
  .stat .lbl {
    font-size: 0.78rem;
    color: var(--text-mid);
    margin-top: 2px;
    font-weight: 600;
  }

  /* ========== الشريط السفلي ========== */
  .bottom-nav {
    position: fixed;
    bottom: 0;
    left: 0;
    right: 0;
    background: var(--white);
    border-top: 1px solid var(--border);
    display: flex;
    justify-content: space-around;
    padding: 8px 0 max(8px, env(safe-area-inset-bottom));
    z-index: 50;
  }
  .bottom-nav button {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 2px;
    color: var(--text-soft);
    font-size: 0.7rem;
    padding: 6px 4px;
    font-weight: 700;
  }
  .bottom-nav button.active { color: var(--blue); }
  .bottom-nav .ic { font-size: 1.25rem; line-height: 1; }
</style>
</head>
<body>

<!-- ========== الهيدر ========== -->
<header class="app-header">
  <div class="header-row">
    <div class="logo-box">
      <img src="icon.png" alt="مقهى الأفكار">
    </div>
    <div class="brand-title">
      <span>☕</span>
      <span>مقهى الأفكار</span>
    </div>
    <button class="header-icon" aria-label="بحث">🔍</button>
  </div>
</header>

<!-- ========== الحاوية الرئيسية ========== -->
<main class="wrap">

  <!-- الهيرو -->
  <section class="hero">
    <h1>عندك فكرة؟<br>ما تسيبهاش في دماغك.</h1>
    <p>فكرتك ببلاش… نشرها بـ9 جنيه.</p>
    <span class="badge-gradient">واحد + واحد = مليون</span>
  </section>

  <!-- الأزرار الرئيسية -->
  <div class="main-actions">
    <button class="btn btn-primary" id="btn-add">💡 اكتب فكرتك</button>
    <button class="btn btn-secondary" id="btn-search">🔎 دور على فكرة</button>
  </div>

  <!-- الإحصائيات -->
  <div class="stats">
    <div class="stat">
      <div class="num" id="stat-total">0</div>
      <div class="lbl">فكرة</div>
    </div>
    <div class="stat">
      <div class="num" id="stat-today">0</div>
      <div class="lbl">اليوم</div>
    </div>
    <div class="stat">
      <div class="num" id="stat-users">0</div>
      <div class="lbl">عضو</div>
    </div>
  </div>

  <!-- مكان العناصر التفاعلية (المرحلة 2) -->
  <!-- <div id="highlights"></div> -->
  <!-- <div id="khatera"></div> -->
  <!-- <div id="daily-idea"></div> -->
  <!-- <div id="trending"></div> -->

  <!-- مكان شبكة الأفكار (المرحلة 3) -->
  <!-- <div id="ideas-grid"></div> -->

</main>

<!-- ========== الشريط السفلي ========== -->
<nav class="bottom-nav">
  <button class="active" data-page="home">
    <span class="ic">🏠</span>
    <span>الرئيسية</span>
  </button>
  <button data-page="search">
    <span class="ic">🔍</span>
    <span>البحث</span>
  </button>
  <button data-page="add">
    <span class="ic">➕</span>
    <span>إضافة</span>
  </button>
  <button data-page="saved">
    <span class="ic">⭐</span>
    <span>المحفوظات</span>
  </button>
  <button data-page="me">
    <span class="ic">👤</span>
    <span>أنا</span>
  </button>
</nav>

<!-- عنوان الأفكار -->
<div class="section-head">
  <h2>📋 الأفكار اللي وصلت</h2>
</div>

<!-- شبكة الأفكار -->
<div id="ideas-grid" class="ideas-grid"></div>

<style>
  .ideas-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin: 20px 0; }
  .idea-card { background: var(--white); border-radius: 14px; padding: 14px; border: 1px solid var(--border); box-shadow: var(--shadow); cursor: pointer; }
  .idea-card:active { transform: scale(.98); }
  .idea-card h3 { margin: 0 0 6px; font-size: 0.95rem; font-weight: 800; color: var(--text); line-height: 1.35; }
  .idea-card .desc { font-size: 0.78rem; color: var(--text-mid); margin: 0 0 10px; line-height: 1.4; min-height: 2.2em; }
  .idea-card .meta { display: flex; flex-wrap: wrap; gap: 4px; margin-bottom: 8px; }
  .idea-card .tag { font-size: 0.68rem; font-weight: 700; padding: 3px 8px; border-radius: 10px; }
  .tag-need { background: #FFF3CD; color: #856404; }
  .tag-loc { background: #EDE9FE; color: #5B21B6; }
  .idea-card .social { display: flex; gap: 8px; font-size: 0.72rem; color: var(--text-soft); font-weight: 600; padding-top: 8px; border-top: 1px solid var(--border); }
  .section-head { display: flex; justify-content: space-between; margin: 24px 0 12px; }
  .section-head h2 { font-size: 1.05rem; font-weight: 800; color: var(--text); margin: 0; }
  .empty { text-align: center; padding: 40px 20px; color: var(--text-mid); }
  .empty .big { font-size: 2.5rem; display: block; margin-bottom: 10px; }
/* ========== Modal (تفاصيل الفكرة) ========== */
  .modal-overlay {
    position: fixed;
    inset: 0;
    background: rgba(0, 0, 0, 0.6);
    z-index: 100;
    display: flex;
    align-items: flex-end;
    justify-content: center;
    animation: fadeIn 0.2s ease;
  }

  @keyframes fadeIn {
    from { opacity: 0; }
    to { opacity: 1; }
  }

  .modal-content {
    background: var(--white);
    width: 100%;
    max-width: 640px;
    max-height: 90vh;
    overflow-y: auto;
    border-top-left-radius: 24px;
    border-top-right-radius: 24px;
    padding: 24px 20px 30px;
    position: relative;
    animation: slideUp 0.3s ease;
  }

  @keyframes slideUp {
    from { transform: translateY(40px); opacity: 0; }
    to { transform: translateY(0); opacity: 1; }
  }

  .modal-close {
    position: absolute;
    top: 16px;
    left: 16px;
    width: 36px;
    height: 36px;
    border-radius: 50%;
    background: var(--bg-soft);
    font-size: 1rem;
    font-weight: 800;
    color: var(--text-mid);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 2;
  }

  .modal-content h2 {
    font-size: 1.4rem;
    font-weight: 900;
    color: var(--text);
    margin: 0 0 12px;
    padding-left: 50px;
    line-height: 1.3;
  }

  .modal-meta {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    margin-bottom: 20px;
  }

  .modal-meta .tag {
    font-size: 0.78rem;
    font-weight: 700;
    padding: 5px 12px;
    border-radius: 12px;
  }

  .modal-section {
    margin-bottom: 20px;
  }

  .modal-section h3 {
    font-size: 0.85rem;
    font-weight: 800;
    color: var(--text-mid);
    margin: 0 0 6px;
  }

  .modal-section p {
    font-size: 1rem;
    color: var(--text);
    line-height: 1.6;
    margin: 0;
  }

  .modal-social {
    display: flex;
    gap: 16px;
    padding: 14px 0;
    border-top: 1px solid var(--border);
    border-bottom: 1px solid var(--border);
    font-size: 0.9rem;
    color: var(--text-mid);
    font-weight: 700;
    margin-bottom: 20px;
  }

  .modal-actions {
    display: flex;
    gap: 10px;
  }

  .modal-actions .btn {
    flex: 1;
  }

  /* ========== Toast ========== */
  .toast {
    position: fixed;
    bottom: 100px;
    left: 50%;
    transform: translateX(-50%) translateY(20px);
    background: var(--text);
    color: var(--white);
    padding: 12px 24px;
    border-radius: 24px;
    font-size: 0.9rem;
    font-weight: 700;
    z-index: 200;
    opacity: 0;
    transition: all 0.3s ease;
    pointer-events: none;
    max-width: 90vw;
    text-align: center;
    box-shadow: 0 4px 20px rgba(0, 0, 0, 0.2);
  }

  .toast.show {
    opacity: 1;
    transform: translateX(-50%) translateY(0);
  }</style>

<script>
const DEMO_IDEAS = [
  { id: 'demo_1', title: 'صالون رجالي متنقل', desc: 'صالون رجالي بييجي لحد البيت أو الشغل.', author: 'أحمد', needLabel: '💰 تمويل', governorate: 'القاهرة', views: 250, saves: 40, shares: 12, createdAt: Date.now() - (1*24*60*60*1000), status: 'published' },
  { id: 'demo_2', title: 'مطعم فول وطعمية بلمسة جديدة', desc: 'فول وطعمية بس بشكل عصري ونظيف.', author: 'منى', needLabel: '🤝 شريك', governorate: 'الجيزة', views: 180, saves: 32, shares: 8, createdAt: Date.now() - (2*24*60*60*1000), status: 'published' },
  { id: 'demo_3', title: 'جيم صغير للنساء', desc: 'جيم مخصص للنساء فقط، بمدربات.', author: 'سارة', needLabel: '💰 تمويل', governorate: 'الإسكندرية', views: 320, saves: 65, shares: 22, createdAt: Date.now() - (3*24*60*60*1000), status: 'published' },
  { id: 'demo_4', title: 'متجر ملابس أونلاين', desc: 'متجر ملابس شبابية أونلاين.', author: 'هدى', needLabel: '💰🤝 تمويل أو شريك', governorate: 'القاهرة', views: 145, saves: 28, shares: 5, createdAt: Date.now() - (4*24*60*60*1000), status: 'published' },
  { id: 'demo_5', title: 'تطبيق حجز مواعيد الدكتور', desc: 'تطبيق بسيط يحجز مواعيد الدكتور.', author: 'محمود', needLabel: '🤝 شريك', governorate: 'القاهرة', views: 210, saves: 45, shares: 15, createdAt: Date.now() - (5*24*60*60*1000), status: 'published' },
  { id: 'demo_6', title: 'مشروع زراعة أسطح', desc: 'استغلال أسطح المباني في زراعة خضروات.', author: 'كريم', needLabel: '👥 حد يساعدني', governorate: 'القاهرة', views: 95, saves: 18, shares: 4, createdAt: Date.now() - (6*24*60*60*1000), status: 'published' },
  { id: 'demo_7', title: 'رحلات سياحية داخلية', desc: 'رحلات سياحية للشباب داخل مصر.', author: 'ياسمين', needLabel: '💰 تمويل', governorate: 'الأقصر', views: 270, saves: 52, shares: 18, createdAt: Date.now() - (7*24*60*60*1000), status: 'published' },
  { id: 'demo_8', title: 'خدمة تنظيف منازل احترافية', desc: 'شركة تنظيف منازل بفريق مدرب.', author: 'نهى', needLabel: '💰🤝 تمويل أو شريك', governorate: 'القاهرة', views: 160, saves: 30, shares: 7, createdAt: Date.now() - (8*24*60*60*1000), status: 'published' }
];

const STORAGE_KEY = 'afkario_ideas_v1';

function getIdeas() {
  try {
    const stored = localStorage.getItem(STORAGE_KEY);
    if (stored) return JSON.parse(stored);
  } catch (e) {}
  localStorage.setItem(STORAGE_KEY, JSON.stringify(DEMO_IDEAS));
  return DEMO_IDEAS;
}

function renderStats() {
  const ideas = getIdeas().filter(i => i.status === 'published');
  const today = new Date().toDateString();
  const todayCount = ideas.filter(i => new Date(i.createdAt).toDateString() === today).length;
  document.getElementById('stat-total').textContent = ideas.length;
  document.getElementById('stat-today').textContent = todayCount;
  document.getElementById('stat-users').textContent = ideas.length;
}

function renderIdeas() {
  const ideas = getIdeas().filter(i => i.status === 'published').sort((a, b) => b.createdAt - a.createdAt);
  const grid = document.getElementById('ideas-grid');
  grid.innerHTML = ideas.map(idea => `
    <div class="idea-card" data-id="${idea.id}">
      <h3>${idea.title}</h3>
      <p class="desc">${idea.desc}</p>
      <div class="meta">
        <span class="tag tag-need">${idea.needLabel}</span>
        <span class="tag tag-loc">📍 ${idea.governorate}</span>
      </div>
      <div class="social">
        <span>👁️ ${idea.views}</span>
        <span>⭐ ${idea.saves}</span>
        <span>📤 ${idea.shares}</span>
      </div>
    </div>
  `).join('');
}

function init() {
  renderStats();
  renderIdeas();
  document.addEventListener('click', (e) => {
    const card = e.target.closest('.idea-card');
    if (card && card.dataset.id) openDetail(card.dataset.id);
  });
}
// ========== فتح تفاصيل الفكرة ==========
function openDetail(id) {
  const idea = getIdeas().find(i => i.id === id);
  if (!idea) return;

  // إنشاء المودال
  const modal = document.createElement('div');
  modal.className = 'modal-overlay';
  modal.id = 'idea-modal';
  
  modal.innerHTML = `
    <div class="modal-content">
      <button class="modal-close" onclick="closeDetail()">✕</button>
      
      <h2>${idea.title}</h2>
      
      <div class="modal-meta">
        <span class="tag tag-need">${idea.needLabel}</span>
        <span class="tag tag-loc">📍 ${idea.governorate}</span>
      </div>
      
      <div class="modal-section">
        <h3>📝 الوصف</h3>
        <p>${idea.desc}</p>
      </div>
      
      <div class="modal-section">
        <h3>👤 صاحب الفكرة</h3>
        <p>${idea.author}</p>
      </div>
      
      <div class="modal-social">
        <span>👁️ ${idea.views} مشاهدة</span>
        <span>⭐ ${idea.saves} حفظ</span>
        <span>📤 ${idea.shares} مشاركة</span>
      </div>
      
      <div class="modal-actions">
        <button class="btn btn-primary" onclick="toast('قريباً — التواصل هيتفعّل قريب')">
          💬 تواصل
        </button>
        <button class="btn btn-secondary" onclick="toast('اتحفظت للقعدة الجاية ⭐')">
          ⭐ احفظ
        </button>
      </div>
    </div>
  `;
  
  document.body.appendChild(modal);
  
  // تفعيل الإغلاق
  modal.addEventListener('click', (e) => {
    if (e.target.id === 'idea-modal') closeDetail();
  });
  
  // منع scroll الصفحة
  document.body.style.overflow = 'hidden';
}

function closeDetail() {
  const modal = document.getElementById('idea-modal');
  if (modal) modal.remove();
  document.body.style.overflow = '';
}

// ========== Toast (رسالة سريعة) ==========
function toast(msg) {
  const t = document.createElement('div');
  t.className = 'toast';
  t.textContent = msg;
  document.body.appendChild(t);
  
  setTimeout(() => t.classList.add('show'), 10);
  setTimeout(() => {
    t.classList.remove('show');
    setTimeout(() => t.remove(), 300);
  }, 2500);
}
document.addEventListener('DOMContentLoaded', init);
</script>
</body>
</html>
