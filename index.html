<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>☕ مقهى الأفكار - واحد + واحد = مليون</title>
<meta name="theme-color" content="#4285F4">
<link rel="icon" type="image/png" href="icon.png">
<link rel="apple-touch-icon" href="icon.png">
<link rel="manifest" href="manifest.json">
<style>
  :root {
    --blue: #4285F4; --green: #34A853; --yellow: #FBBC04; --orange: #FF6D00; --pink: #FF4FCB;
    --bg: #FAFAFA; --white: #FFFFFF; --border: #E5E7EB; --text: #1C1C1E; --text-mid: #4B5563; --text-soft: #8E8E8E;
    --shadow: 0 2px 8px rgba(0,0,0,0.05);
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Tahoma, Arial, sans-serif; }
  body { margin: 0; padding: 0; background: var(--bg); color: var(--text); padding-bottom: 100px; }
  a { text-decoration: none; color: var(--blue); }
  button { cursor: pointer; border: none; outline: none; }

  /* الهيدر */
  .header { background: var(--white); padding: 15px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border); position: sticky; top: 0; z-index: 10; }
  .logo { display: flex; align-items: center; gap: 8px; font-weight: 900; font-size: 1.2rem; }
  .logo img { width: 35px; height: 35px; border-radius: 8px; }
  .btn-profile { background: var(--bg-soft); padding: 8px 15px; border-radius: 20px; font-weight: bold; font-size: 0.9rem; }

  .container { max-width: 600px; margin: 0 auto; padding: 15px; }
  
  /* شريط PWA */
  .pwa-banner { background: linear-gradient(135deg, var(--blue), #2b6fd9); color: white; padding: 12px; border-radius: 12px; margin-bottom: 20px; display: flex; justify-content: space-between; align-items: center; font-size: 0.85rem; font-weight: bold; }
  .pwa-banner button { background: white; color: var(--blue); padding: 6px 12px; border-radius: 8px; font-weight: bold; }

  /* الهيرو */
  .hero { text-align: center; margin: 20px 0 30px; }
  .hero h1 { font-size: 1.8rem; margin: 0 0 10px; line-height: 1.3; }
  .hero p { color: var(--text-mid); font-size: 1.1rem; margin: 0 0 15px; }
  .badge-gradient { display: inline-block; background: linear-gradient(135deg, var(--yellow), var(--orange)); color: white; padding: 6px 20px; border-radius: 20px; font-weight: bold; margin-bottom: 20px; }
  
  .btn-main { background: var(--blue); color: white; padding: 15px 30px; border-radius: 12px; font-size: 1.1rem; font-weight: bold; width: 100%; margin-bottom: 10px; display: block; text-align: center; }
  .btn-secondary { background: var(--white); color: var(--text); border: 1.5px solid var(--border); padding: 15px 30px; border-radius: 12px; font-size: 1.1rem; font-weight: bold; width: 100%; display: block; text-align: center; }

  /* شبكة الأفكار */
  .ideas-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 15px; }
  .idea-card { background: var(--white); border-radius: 14px; padding: 14px; border: 1px solid var(--border); box-shadow: var(--shadow); display: flex; flex-direction: column; }
  .idea-card h3 { margin: 0 0 6px; font-size: 1rem; font-weight: 800; cursor: pointer; }
  .idea-card p { margin: 0 0 10px; font-size: 0.8rem; color: var(--text-mid); line-height: 1.4; flex-grow: 1; cursor: pointer; }
  .tags { display: flex; flex-wrap: wrap; gap: 4px; margin-bottom: 10px; }
  .tag { font-size: 0.7rem; padding: 4px 8px; border-radius: 8px; font-weight: bold; }
  .tag-need { background: #FFF3CD; color: #856404; }
  .tag-loc { background: #EDE9FE; color: #5B21B6; }
  
  /* الإيموجي */
  .reactions-bar { display: flex; justify-content: space-between; border-top: 1px dashed var(--border); padding-top: 8px; margin-bottom: 8px; }
  .react-btn { background: none; font-size: 0.85rem; font-weight: bold; color: var(--text-mid); padding: 4px; }
  .react-btn:active { background: #FFF3CD; border-radius: 6px; }
  
  /* أزرار الكارت */
  .card-actions { display: flex; justify-content: space-between; border-top: 1px solid var(--border); padding-top: 8px; margin-top: auto; }
  .action-btn { background: none; color: var(--text-soft); font-size: 0.75rem; font-weight: bold; padding: 5px; display: flex; align-items: center; gap: 4px; }

  /* الشريط السفلي */
  .bottom-nav { position: fixed; bottom: 0; left: 0; right: 0; background: var(--white); border-top: 1px solid var(--border); display: flex; justify-content: space-around; padding: 10px 0; z-index: 10; }
  .bottom-nav button { display: flex; flex-direction: column; align-items: center; font-size: 0.75rem; font-weight: bold; color: var(--text-soft); background: none; }
  .bottom-nav button.active { color: var(--blue); }
  .bottom-nav .ic { font-size: 1.3rem; margin-bottom: 4px; }

  /* النوافذ */
  .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.6); z-index: 100; display: flex; align-items: flex-end; justify-content: center; }
  .modal-content { background: var(--white); width: 100%; max-width: 600px; border-top-left-radius: 24px; border-top-right-radius: 24px; padding: 24px 20px; max-height: 90vh; overflow-y: auto; }
  .modal-close { float: left; background: var(--bg-soft); width: 35px; height: 35px; border-radius: 50%; font-weight: bold; display: flex; align-items: center; justify-content: center; margin-bottom: 10px; }
  .modal-content h2 { margin: 0 0 15px; font-size: 1.4rem; }
  
  /* الحقول */
  .form-group { margin-bottom: 15px; }
  .form-group label { display: block; margin-bottom: 5px; font-weight: bold; font-size: 0.9rem; }
  .form-group input, .form-group textarea, .form-group select { width: 100%; padding: 12px; border: 1px solid var(--border); border-radius: 10px; font-size: 1rem; font-family: inherit; }
  
  /* الواتساب */
  .wa-group { display: flex; gap: 10px; }
  .wa-group select { width: 100px; padding: 12px 5px; }
  .wa-group input { flex-grow: 1; }
  
  /* شبكة الإيموجي */
  .avatar-grid { display: grid; grid-template-columns: repeat(6, 1fr); gap: 8px; margin-bottom: 15px; }
  .avatar-opt { background: var(--bg-soft); border: 2px solid transparent; font-size: 1.5rem; padding: 8px 0; border-radius: 10px; text-align: center; }
  .avatar-opt.selected { border-color: var(--blue); background: #E3F2FD; }

  .toast { position: fixed; bottom: 80px; left: 50%; transform: translateX(-50%); background: var(--text); color: white; padding: 12px 24px; border-radius: 20px; font-weight: bold; z-index: 200; opacity: 0; transition: 0.3s; pointer-events: none; }
  .toast.show { opacity: 1; }
</style>
</head>
<body>

<!-- الهيدر -->
<header class="header">
  <div class="logo">
    <img src="icon.png" alt="Logo">
    <span>مقهى الأفكار</span>
  </div>
  <button class="btn-profile" onclick="openProfile()" id="header-profile-btn">👤 حسابي</button>
</header>

<main class="container">
  <!-- شريط PWA -->
  <div class="pwa-banner" id="pwa-banner">
    <span>📲 ضيف التطبيق على الشاشة الرئيسية عشان يوصلك إشعارات!</span>
    <button onclick="document.getElementById('pwa-banner').style.display='none'">فهمت</button>
  </div>

  <!-- الهيرو -->
  <div class="hero">
    <h1>عندك فكرة؟<br>ما تسيبهاش في دماغك.</h1>
    <p>فكرتك ببلاش… نشرها بـ9 جنيه.</p>
    <span class="badge-gradient">واحد + واحد = مليون</span>
    <button class="btn-main" onclick="openTrial()" id="trial-btn">🎁 جرب 28 يوم مجاناً</button>
    <button class="btn-secondary" onclick="openAddIdea()">💡 اكتب فكرتك</button>
  </div>

  <h3 style="margin-top: 30px;">📋 الأفكار اللي وصلت</h3>
  <div class="ideas-grid" id="ideas-grid"></div>
</main>

<!-- الشريط السفلي -->
<nav class="bottom-nav">
  <button class="active" onclick="window.scrollTo(0,0)"><span class="ic">🏠</span>الرئيسية</button>
  <button onclick="openAddIdea()"><span class="ic">✍️</span>قول فكرتك</button>
  <button onclick="openProfile()"><span class="ic">👤</span>حسابي</button>
</nav>

<script>
// ==========================================
// البيانات
// ==========================================
const STORAGE_IDEAS = 'afkario_ideas_v4';
const STORAGE_PROFILE = 'afkario_profile_v4';
const STORAGE_TRIAL = 'afkario_trial_end';
const STORAGE_REACTIONS = 'afkario_reactions_v4';
const AVATARS = ['☕', '💡', '🤝', '❤️', '🧠', '🔥', '🌟', '😎', '🎯', '🚀', '💎', '🎨'];

const COUNTRY_CODES = [
  { code: '+20', name: 'مصر 🇪🇬' },
  { code: '+966', name: 'السعودية 🇸🇦' },
  { code: '+971', name: 'الإمارات 🇦🇪' },
  { code: '+965', name: 'الكويت 🇰🇼' },
  { code: '+974', name: 'قطر 🇶🇦' },
  { code: '+973', name: 'البحرين 🇧🇭' },
  { code: '+968', name: 'عمان 🇴🇲' },
  { code: '+962', name: 'الأردن 🇯🇴' },
  { code: '+961', name: 'لبنان 🇱🇧' },
  { code: '+212', name: 'المغرب 🇲🇦' },
  { code: '+213', name: 'الجزائر 🇩🇿' },
  { code: '+216', name: 'تونس 🇹🇳' },
  { code: '+1', name: 'أمريكا/كندا 🇺🇸' },
  { code: '+44', name: 'بريطانيا 🇬🇧' }
];

const DEMO_IDEAS = [
  { id: '1', title: 'صالون رجالي متنقل', desc: 'صالون رجالي بييجي لحد البيت أو الشغل.', need: '💰 تمويل', loc: 'القاهرة', author: 'أحمد', video: '', wa: '+201000000000' },
  { id: '2', title: 'مطعم فول بلمسة عصرية', desc: 'فول وطعمية بس بشكل عصري ونظيف.', need: '🤝 شريك', loc: 'الجيزة', author: 'منى', video: 'https://tiktok.com/...', wa: '' }
];

// جلب البيانات
function getIdeas() {
  let data = localStorage.getItem(STORAGE_IDEAS);
  if (!data) {
    localStorage.setItem(STORAGE_IDEAS, JSON.stringify(DEMO_IDEAS));
    return DEMO_IDEAS;
  }
  return JSON.parse(data);
}
function saveIdeas(ideas) { localStorage.setItem(STORAGE_IDEAS, JSON.stringify(ideas)); }
function getProfile() { return JSON.parse(localStorage.getItem(STORAGE_PROFILE) || '{}'); }
function getReactions() { return JSON.parse(localStorage.getItem(STORAGE_REACTIONS) || '{}'); }
function saveReactions(data) { localStorage.setItem(STORAGE_REACTIONS, JSON.stringify(data)); }

function showToast(msg) {
  const t = document.createElement('div');
  t.className = 'toast';
  t.textContent = msg;
  document.body.appendChild(t);
  setTimeout(() => t.classList.add('show'), 10);
  setTimeout(() => { t.classList.remove('show'); setTimeout(() => t.remove(), 300); }, 2500);
}

// ==========================================
// العرض
// ==========================================
function renderProfileHeader() {
  const profile = getProfile();
  const btn = document.getElementById('header-profile-btn');
  if (profile.name) {
    btn.innerHTML = (profile.avatar || '👤') + ' ' + profile.name;
  } else {
    btn.innerHTML = '👤 حسابي';
  }
}

function renderIdeas() {
  const grid = document.getElementById('ideas-grid');
  const ideas = getIdeas();
  const allReactions = getReactions();
  
  grid.innerHTML = ideas.map(idea => {
    let ideaReacts = allReactions[idea.id] || {};
    let reactionsHtml = '';
    ['😂', '👏', '🤝', '❤️', '🤯'].forEach(emoji => {
      let count = ideaReacts[emoji] || '';
      reactionsHtml += `<button class="react-btn" onclick="addReaction('${idea.id}', '${emoji}', this)">${emoji} <span>${count}</span></button>`;
    });

    return `
      <div class="idea-card">
        <div onclick="openDetail('${idea.id}')">
          <h3>${idea.title}</h3>
          <p>${idea.desc}</p>
          <div class="tags">
            <span class="tag tag-need">${idea.need}</span>
            <span class="tag tag-loc">📍 ${idea.loc}</span>
          </div>
        </div>
        <div class="reactions-bar">${reactionsHtml}</div>
        <div class="card-actions">
          <button class="action-btn" onclick="handleShare('${idea.title}')">📤 مشاركة</button>
          <button class="action-btn" onclick="showToast('🔄 تم إعادة النشر')">🔄 إعادة</button>
          <button class="action-btn" onclick="showToast('⭐ تم الحفظ')">⭐ حفظ</button>
        </div>
      </div>
    `;
  }).join('');
}

// ==========================================
// التفاعلات
// ==========================================
function addReaction(ideaId, emoji, btnElement) {
  const allReactions = getReactions();
  if (!allReactions[ideaId]) allReactions[ideaId] = {};
  if (!allReactions[ideaId][emoji]) allReactions[ideaId][emoji] = 0;
  allReactions[ideaId][emoji] += 1;
  saveReactions(allReactions);
  
  const span = btnElement.querySelector('span');
  span.textContent = allReactions[ideaId][emoji];
  btnElement.style.background = '#FFF3CD';
  setTimeout(() => btnElement.style.background = 'none', 300);
}

function openDetail(id) {
  const idea = getIdeas().find(i => i.id === id);
  if (!idea) return;
  
  // أزرار التواصل
  let contactHtml = '';
  if (idea.wa) {
    contactHtml += `<a href="https://wa.me/${idea.wa.replace(/[^0-9]/g, '')}" target="_blank" class="btn-main" style="background:#25D366; margin-bottom:10px;">💬 تواصل واتساب</a>`;
  }
  if (idea.video) {
    contactHtml += `<a href="${idea.video}" target="_blank" class="btn-main" style="background:var(--pink); margin-bottom:10px;">🎬 شاهد الفيديو</a>`;
  }
  if (!idea.wa && !idea.video) {
    contactHtml += `<div style="text-align:center; color:var(--text-soft); padding:10px;">لا توجد وسيلة تواصل متاحة حالياً</div>`;
  }

  const modal = document.createElement('div');
  modal.className = 'modal-overlay';
  modal.innerHTML = `
    <div class="modal-content">
      <button class="modal-close" onclick="this.closest('.modal-overlay').remove()">✕</button>
      <h2>${idea.title}</h2>
      <div class="tags" style="margin-bottom:15px;">
        <span class="tag tag-need">${idea.need}</span>
        <span class="tag tag-loc">📍 ${idea.loc}</span>
      </div>
      <p style="font-size:1rem; line-height:1.6; margin-bottom:20px;">${idea.desc}</p>
      <p style="font-size:0.9rem; color:var(--text-mid); margin-bottom:20px;">👤 صاحب الفكرة: ${idea.author || 'مجهول'}</p>
      ${contactHtml}
    </div>
  `;
  document.body.appendChild(modal);
}

function handleShare(title) {
  if (navigator.share) {
    navigator.share({ title: title, text: 'شوف الفكرة دي على مقهى الأفكار!' }).catch(()=>{});
  } else {
    showToast('📤 تم تجهيز الرابط للمشاركة');
  }
}

// ==========================================
// إضافة فكرة جديدة
// ==========================================
function openAddIdea() {
  const profile = getProfile();
  const modal = document.createElement('div');
  modal.className = 'modal-overlay';
  modal.innerHTML = `
    <div class="modal-content">
      <button class="modal-close" onclick="this.closest('.modal-overlay').remove()">✕</button>
      <h2>💡 اكتب فكرتك</h2>
      
      <div class="form-group">
        <label>عنوان الفكرة</label>
        <input type="text" id="f-title" placeholder="مثال: مطعم فول بلمسة عصرية">
      </div>
      
      <div class="form-group">
        <label>الوصف</label>
        <textarea id="f-desc" rows="3" placeholder="اشرح فكرتك باختصار..."></textarea>
      </div>
      
      <div class="form-group">
        <label>الاحتياج</label>
        <select id="f-need">
          <option value="💰 تمويل">💰 تمويل</option>
          <option value="🤝 شريك">🤝 شريك</option>
          <option value="👥 مساعدة">👥 مساعدة</option>
          <option value="💡 مجرد فكرة بدماغي">💡 مجرد فكرة بدماغي</option>
        </select>
      </div>
      
      <div class="form-group">
        <label>المدينة / المحافظة (اكتب يدوي)</label>
        <input type="text" id="f-loc" placeholder="مثال: القاهرة، الإسكندرية...">
      </div>

      <div class="form-group">
        <label>رابط فيديو (اختياري - تيك توك/انستجرام/فيسبوك)</label>
        <input type="url" id="f-video" placeholder="https://tiktok.com/...">
      </div>
      
      <button class="btn-main" onclick="saveIdea()">نشر الفكرة</button>
    </div>
  `;
  document.body.appendChild(modal);
}

function saveIdea() {
  const title = document.getElementById('f-title').value.trim();
  const desc = document.getElementById('f-desc').value.trim();
  const need = document.getElementById('f-need').value;
  const loc = document.getElementById('f-loc').value.trim();
  const video = document.getElementById('f-video').value.trim();
  const profile = getProfile();

  if (title.length < 4) return showToast('⚠️ اكتب عنوان أوضح');
  if (desc.length < 10) return showToast('⚠️ اكتب وصف أطول');
  if (!loc) return showToast('⚠️ اكتب المدينة أو المحافظة');

  const ideas = getIdeas();
  ideas.unshift({ 
    id: Date.now().toString(), 
    title, desc, need, loc, video, 
    author: profile.name || 'مجهول',
    wa: profile.whatsapp || ''
  });
  saveIdeas(ideas);

  showToast('🎉 تم نشر الفكرة!');
  document.querySelector('.modal-overlay').remove();
  renderIdeas();
}

// ==========================================
// الحساب الشخصي (البروفايل)
// ==========================================
function openProfile() {
  const profile = getProfile();
  const selectedAvatar = profile.avatar || '☕';
  
  let avatarsHtml = AVATARS.map(emoji => 
    `<button class="avatar-opt ${emoji === selectedAvatar ? 'selected' : ''}" onclick="selectAvatar(this, '${emoji}')">${emoji}</button>`
  ).join('');

  let codesHtml = COUNTRY_CODES.map(c => 
    `<option value="${c.code}" ${profile.countryCode === c.code ? 'selected' : ''}>${c.name} (${c.code})</option>`
  ).join('');

  const modal = document.createElement('div');
  modal.className = 'modal-overlay';
  modal.innerHTML = `
    <div class="modal-content">
      <button class="modal-close" onclick="this.closest('.modal-overlay').remove()">✕</button>
      <h2>👤 حسابي</h2>
      
      <div class="form-group">
        <label>الاسم</label>
        <input type="text" id="p-name" value="${profile.name || ''}" placeholder="اكتب اسمك">
      </div>
      
      <div class="form-group">
        <label>الصورة الرمزية</label>
        <div class="avatar-grid" id="avatar-grid">${avatarsHtml}</div>
        <input type="hidden" id="p-avatar-val" value="${selectedAvatar}">
      </div>

      <div class="form-group">
        <label>رقم الواتساب (للتواصل)</label>
        <div class="wa-group">
          <select id="p-code">${codesHtml}</select>
          <input type="tel" id="p-wa" value="${profile.whatsapp || ''}" placeholder="1012345678" dir="ltr">
        </div>
        <div style="margin-top:8px;">
           <button id="verify-btn" style="background:var(--bg-soft); padding:8px; border-radius:8px; font-size:0.8rem; font-weight:bold; width:100%;" onclick="verifyWhatsapp()">
             ${profile.verified ? '✅ الرقم موثق' : '📲 إرسال كود التفعيل'}
           </button>
        </div>
      </div>

      <div class="form-group">
        <label>حالة الاشتراك</label>
        <div style="background:var(--bg-soft); padding:12px; border-radius:8px; font-size:0.9rem;">
          ${checkTrialStatus()}
        </div>
      </div>
      
      <button class="btn-main" onclick="saveProfile()">حفظ التعديلات</button>
    </div>
  `;
  document.body.appendChild(modal);
}

function selectAvatar(btn, emoji) {
  document.querySelectorAll('.avatar-opt').forEach(b => b.classList.remove('selected'));
  btn.classList.add('selected');
  document.getElementById('p-avatar-val').value = emoji;
}

// محاكاة تفعيل الواتساب
function verifyWhatsapp() {
  const wa = document.getElementById('p-wa').value.trim();
  if (!wa || wa.length < 8) return showToast('⚠️ اكتب رقم واتساب صحيح أولاً');
  
  // كود وهمي للتفعيل
  const code = prompt("تم إرسال كود التفعيل (محاكاة).\nاكتب الكود 1234:");
  if (code === '1234') {
    const profile = getProfile();
    profile.verified = true;
    localStorage.setItem(STORAGE_PROFILE, JSON.stringify(profile));
    showToast('✅ تم توثيق رقم الواتساب بنجاح');
    document.querySelector('.modal-overlay').remove();
    openProfile(); // إعادة فتح الصفحة
  } else {
    showToast('❌ الكود غير صحيح');
  }
}

function saveProfile() {
  const name = document.getElementById('p-name').value.trim();
  const avatar = document.getElementById('p-avatar-val').value;
  const code = document.getElementById('p-code').value;
  const wa = document.getElementById('p-wa').value.trim();
  
  if (!name) return showToast('⚠️ اكتب اسمك الأول');
  
  const oldProfile = getProfile();
  
  localStorage.setItem(STORAGE_PROFILE, JSON.stringify({ 
    name, 
    avatar, 
    countryCode: code,
    whatsapp: wa,
    verified: oldProfile.verified || false
  }));
  
  showToast('✅ تم حفظ الحساب');
  document.querySelector('.modal-overlay').remove();
  renderProfileHeader();
}

// ==========================================
// التجربة المجانية
// ==========================================
function checkTrialStatus() {
  const trialEnd = localStorage.getItem(STORAGE_TRIAL);
  if (!trialEnd) return '<span style="color:red;">❌ غير مشترك</span>';
  const now = Date.now();
  const end = parseInt(trialEnd);
  if (now > end) return '<span style="color:red;">❌ انتهت التجربة المجانية</span>';
  const daysLeft = Math.ceil((end - now) / (1000 * 60 * 60 * 24));
  return `<span style="color:green;">✅ تجربة مجانية (متبقي ${daysLeft} يوم)</span>`;
}

function openTrial() {
  const modal = document.createElement('div');
  modal.className = 'modal-overlay';
  modal.innerHTML = `
    <div class="modal-content">
      <button class="modal-close" onclick="this.closest('.modal-overlay').remove()">✕</button>
      <h2 style="text-align:center;">🎁 الباقات</h2>
      <div style="border:2px solid var(--green); border-radius:12px; padding:15px; text-align:center; margin-bottom:15px;">
        <h3 style="margin:0 0 10px; color:var(--green);">تجربة مجانية</h3>
        <p style="font-size:2rem; font-weight:bold; margin:0 0 10px;">0 <span style="font-size:1rem;">جنيه</span></p>
        <p style="font-size:0.9rem; color:var(--text-mid); margin-bottom:15px;">لمدة 28 يوم</p>
        <button class="btn-main" style="background:var(--green);" onclick="activateTrial()">ابدأ التجربة</button>
      </div>
    </div>
  `;
  document.body.appendChild(modal);
}

function activateTrial() {
  const endDate = Date.now() + (28 * 24 * 60 * 60 * 1000);
  localStorage.setItem(STORAGE_TRIAL, endDate);
  showToast('🎉 تم تفعيل التجربة المجانية 28 يوم!');
  document.querySelector('.modal-overlay').remove();
  
  const trialBtn = document.getElementById('trial-btn');
  trialBtn.textContent = '✅ أنت مشترك (تجربة مجانية)';
  trialBtn.style.background = 'var(--green)';
}

// التشغيل
document.addEventListener('DOMContentLoaded', () => {
  renderProfileHeader();
  renderIdeas();
  
  const trialEnd = localStorage.getItem(STORAGE_TRIAL);
  if (trialEnd && Date.now() < parseInt(trialEnd)) {
    const trialBtn = document.getElementById('trial-btn');
    trialBtn.textContent = '✅ أنت مشترك (تجربة مجانية)';
    trialBtn.style.background = 'var(--green)';
  }
});
</script>
</body>
</html>
