<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>

<style>
  /* ========== المتغيرات ========== */
  :root {
    --blue: #4285F4;
    --green: #34A853;
    --yellow: #FBBC04;
    --orange: #FF6D00;
    --pink: #FF4FCB;
    --bg: #FAFAFA;
    --bg-soft: #F5F5F7;
    --white: #FFFFFF;
    --border: #E5E7EB;
    --text: #1C1C1E;
    --text-soft: #8E8E8E;
    --text-mid: #4B5563;
    --shadow: 0 1px 3px rgba(0,0,0,.05), 0 1px 2px rgba(0,0,0,.03);
    --radius: 16px;
  }

  * {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
  }

  html, body {
    margin: 0;
    padding: 0;
    background: var(--bg);
  }

  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Tahoma, Arial, sans-serif;
    color: var(--text);
    direction: rtl;
    text-align: right;
    line-height: 1.6;
    min-height: 100vh;
    padding-bottom: 130px;
    font-size: 15px;
  }

  a { color: var(--blue); text-decoration: none; }
  button { font-family: inherit; cursor: pointer; border: none; background: none; color: inherit; }
  img { max-width: 100%; display: block; }

  /* ========== الهيدر ========== */
  .app-header {
    background: var(--white);
    border-bottom: 1px solid var(--border);
    padding: 12px 16px;
    position: sticky;
    top: 0;
    z-index: 40;
  }
  .header-row {
    max-width: 640px;
    margin: 0 auto;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
  }
  .logo-box {
    width: 40px;
    height: 40px;
    border-radius: 10px;
    overflow: hidden;
    flex-shrink: 0;
  }
  .logo-box img { width: 100%; height: 100%; }
  .brand-title {
    font-size: 1.15rem;
    font-weight: 800;
    color: var(--text);
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .header-icon {
    width: 40px;
    height: 40px;
    border-radius: 50%;
    background: var(--bg-soft);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 1.1rem;
  }

  /* ========== الحاوية ========== */
  .wrap {
    max-width: 640px;
    margin: 0 auto;
    padding: 0 16px;
  }

  /* ========== الهيرو ========== */
  .hero {
    text-align: center;
    padding: 32px 0 24px;
  }
  .hero h1 {
    font-size: 1.7rem;
    font-weight: 900;
    color: var(--text);
    margin: 0 0 10px;
    line-height: 1.3;
  }
  .hero p {
    font-size: 0.98rem;
    color: var(--text-mid);
    margin: 0 0 16px;
  }
  .badge-gradient {
    display: inline-block;
    background: linear-gradient(135deg, var(--yellow), var(--orange));
    color: var(--white);
    padding: 8px 22px;
    border-radius: 24px;
    font-weight: 800;
    font-size: 0.95rem;
    box-shadow: 0 4px 12px rgba(255,109,0,.25);
  }

  /* ========== الأزرار الرئيسية ========== */
  .main-actions {
    display: flex;
    gap: 10px;
    margin: 20px 0;
  }
  .btn {
    flex: 1;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    padding: 14px 18px;
    border-radius: 14px;
    font-size: 1rem;
    font-weight: 800;
    transition: transform .08s ease;
  }
  .btn:active { transform: scale(.97); }
  .btn-primary {
    background: linear-gradient(135deg, var(--blue), #2b6fd9);
    color: var(--white);
    box-shadow: 0 4px 12px rgba(66,133,244,.25);
  }
  .btn-secondary {
    background: var(--white);
    color: var(--text);
    border: 1.5px solid var(--border);
  }
  .btn-block { width: 100%; }

  /* ========== الإحصائيات ========== */
  .stats {
    display: flex;
    gap: 10px;
    margin: 16px 0;
  }
  .stat {
    flex: 1;
    background: var(--white);
    border-radius: var(--radius);
    padding: 14px 10px;
    text-align: center;
    box-shadow: var(--shadow);
    border: 1px solid var(--border);
  }
  .stat .num {
    font-size: 1.5rem;
    font-weight: 900;
    color: var(--blue);
  }
  .stat .lbl {
    font-size: 0.78rem;
    color: var(--text-mid);
    margin-top: 2px;
    font-weight: 600;
  }

  /* ========== الشريط السفلي ========== */
  .bottom-nav {
    position: fixed;
    bottom: 0;
    left: 0;
    right: 0;
    background: var(--white);
    border-top: 1px solid var(--border);
    display: flex;
    justify-content: space-around;
    padding: 8px 0 max(8px, env(safe-area-inset-bottom));
    z-index: 50;
  }
  .bottom-nav button {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 2px;
    color: var(--text-soft);
    font-size: 0.7rem;
    padding: 6px 4px;
    font-weight: 700;
  }
  .bottom-nav button.active { color: var(--blue); }
  .bottom-nav .ic { font-size: 1.25rem; line-height: 1; }
</style>
</head>
<body>

</div>
<!-- خانة البحث -->

    <input type="text" id="search-input" placeholder="🔎 ابحث في الأفكار...">

<style>
  .ideas-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin: 20px 0; }
  .idea-card { background: var(--white); border-radius: 14px; padding: 14px; border: 1px solid var(--border); box-shadow: var(--shadow); cursor: pointer; }
  .idea-card:active { transform: scale(.98); }
  .idea-card h3 { margin: 0 0 6px; font-size: 0.95rem; font-weight: 800; color: var(--text); line-height: 1.35; }
  .idea-card .desc { font-size: 0.78rem; color: var(--text-mid); margin: 0 0 10px; line-height: 1.4; min-height: 2.2em; }
  .idea-card .meta { display: flex; flex-wrap: wrap; gap: 4px; margin-bottom: 8px; }
  .idea-card .tag { font-size: 0.68rem; font-weight: 700; padding: 3px 8px; border-radius: 10px; }
  .tag-need { background: #FFF3CD; color: #856404; }
  .tag-loc { background: #EDE9FE; color: #5B21B6; }
  .idea-card .social { display: flex; gap: 8px; font-size: 0.72rem; color: var(--text-soft); font-weight: 600; padding-top: 8px; border-top: 1px solid var(--border); }
  .section-head { display: flex; justify-content: space-between; margin: 24px 0 12px; }
  .section-head h2 { font-size: 1.05rem; font-weight: 800; color: var(--text); margin: 0; }
  .empty { text-align: center; padding: 40px 20px; color: var(--text-mid); }
  .empty .big { font-size: 2.5rem; display: block; margin-bottom: 10px; }
/* ========== Modal (تفاصيل الفكرة) ========== */
  .modal-overlay {
    position: fixed;
    inset: 0;
    background: rgba(0, 0, 0, 0.6);
    z-index: 100;
    display: flex;
    align-items: flex-end;
    justify-content: center;
    animation: fadeIn 0.2s ease;
  }

  @keyframes fadeIn {
    from { opacity: 0; }
    to { opacity: 1; }
  }

  .modal-content {
    background: var(--white);
    width: 100%;
    max-width: 640px;
    max-height: 90vh;
    overflow-y: auto;
    border-top-left-radius: 24px;
    border-top-right-radius: 24px;
    padding: 24px 20px 30px;
    position: relative;
    animation: slideUp 0.3s ease;
  }

  @keyframes slideUp {
    from { transform: translateY(40px); opacity: 0; }
    to { transform: translateY(0); opacity: 1; }
  }

  .modal-close {
    position: absolute;
    top: 16px;
    left: 16px;
    width: 36px;
    height: 36px;
    border-radius: 50%;
    background: var(--bg-soft);
    font-size: 1rem;
    font-weight: 800;
    color: var(--text-mid);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 2;
  }

  .modal-content h2 {
    font-size: 1.4rem;
    font-weight: 900;
    color: var(--text);
    margin: 0 0 12px;
    padding-left: 50px;
    line-height: 1.3;
  }

  .modal-meta {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    margin-bottom: 20px;
  }

  .modal-meta .tag {
    font-size: 0.78rem;
    font-weight: 700;
    padding: 5px 12px;
    border-radius: 12px;
  }

  .modal-section {
    margin-bottom: 20px;
  }

  .modal-section h3 {
    font-size: 0.85rem;
    font-weight: 800;
    color: var(--text-mid);
    margin: 0 0 6px;
  }

  .modal-section p {
    font-size: 1rem;
    color: var(--text);
    line-height: 1.6;
    margin: 0;
  }

  .modal-social {
    display: flex;
    gap: 16px;
    padding: 14px 0;
    border-top: 1px solid var(--border);
    border-bottom: 1px solid var(--border);
    font-size: 0.9rem;
    color: var(--text-mid);
    font-weight: 700;
    margin-bottom: 20px;
  }

  .modal-actions {
    display: flex;
    gap: 10px;
  }

  .modal-actions .btn {
    flex: 1;
  }

  /* ========== Toast ========== */
  .toast {
    position: fixed;
    bottom: 100px;
    left: 50%;
    transform: translateX(-50%) translateY(20px);
    background: var(--text);
    color: var(--white);
    padding: 12px 24px;
    border-radius: 24px;
    font-size: 0.9rem;
    font-weight: 700;
    z-index: 200;
    opacity: 0;
    transition: all 0.3s ease;
    pointer-events: none;
    max-width: 90vw;
    text-align: center;
    box-shadow: 0 4px 20px rgba(0, 0, 0, 0.2);
  }

  .toast.show {
    opacity: 1;
    transform: translateX(-50%) translateY(0);
  }/* ========== خانة البحث ========== */
  .search-box {
    margin: 16px 0;
  }

  .search-box input {
    width: 100%;
    padding: 14px 16px;
    border-radius: 14px;
    border: 1.5px solid var(--border);
    background: var(--white);
    font-family: inherit;
    font-size: 1rem;
    color: var(--text);
    box-sizing: border-box;
  }

  .search-box input:focus {
    outline: none;
    border-color: var(--blue);
  }
  /* ========== نموذج الإضافة ========== */
  .modal-subtitle {
    font-size: 0.9rem;
    color: var(--text-mid);
    margin: 0 0 20px;
    padding-left: 50px;
  }

  .form-group {
    margin-bottom: 16px;
  }

  .form-group label {
    display: block;
    font-weight: 700;
    color: var(--text-mid);
    font-size: 0.85rem;
    margin-bottom: 6px;
  }

  .form-group input,
  .form-group textarea,
  .form-group select {
    width: 100%;
    padding: 13px 14px;
    border-radius: 12px;
    border: 1.5px solid var(--border);
    background: var(--white);
    font-family: inherit;
    font-size: 1rem;
    color: var(--text);
    box-sizing: border-box;
  }

  .form-group input:focus,
  .form-group textarea:focus,
  .form-group select:focus {
    outline: none;
    border-color: var(--blue);
  }

  .form-group textarea {
    min-height: 100px;
    resize: vertical;
  }
</style>
<script>
const DEMO_IDEAS = [
  { id: 'demo_1', title: 'صالون رجالي متنقل', desc: 'صالون رجالي بييجي لحد البيت أو الشغل.', author: 'أحمد', needLabel: '💰 تمويل', governorate: 'القاهرة', views: 250, saves: 40, shares: 12, createdAt: Date.now() - (1*24*60*60*1000), status: 'published' },
  { id: 'demo_2', title: 'مطعم فول وطعمية بلمسة جديدة', desc: 'فول وطعمية بس بشكل عصري ونظيف.', author: 'منى', needLabel: '🤝 شريك', governorate: 'الجيزة', views: 180, saves: 32, shares: 8, createdAt: Date.now() - (2*24*60*60*1000), status: 'published' },
  { id: 'demo_3', title: 'جيم صغير للنساء', desc: 'جيم مخصص للنساء فقط، بمدربات.', author: 'سارة', needLabel: '💰 تمويل', governorate: 'الإسكندرية', views: 320, saves: 65, shares: 22, createdAt: Date.now() - (3*24*60*60*1000), status: 'published' },
  { id: 'demo_4', title: 'متجر ملابس أونلاين', desc: 'متجر ملابس شبابية أونلاين.', author: 'هدى', needLabel: '💰🤝 تمويل أو شريك', governorate: 'القاهرة', views: 145, saves: 28, shares: 5, createdAt: Date.now() - (4*24*60*60*1000), status: 'published' },
  { id: 'demo_5', title: 'تطبيق حجز مواعيد الدكتور', desc: 'تطبيق بسيط يحجز مواعيد الدكتور.', author: 'محمود', needLabel: '🤝 شريك', governorate: 'القاهرة', views: 210, saves: 45, shares: 15, createdAt: Date.now() - (5*24*60*60*1000), status: 'published' },
  { id: 'demo_6', title: 'مشروع زراعة أسطح', desc: 'استغلال أسطح المباني في زراعة خضروات.', author: 'كريم', needLabel: '👥 حد يساعدني', governorate: 'القاهرة', views: 95, saves: 18, shares: 4, createdAt: Date.now() - (6*24*60*60*1000), status: 'published' },
  { id: 'demo_7', title: 'رحلات سياحية داخلية', desc: 'رحلات سياحية للشباب داخل مصر.', author: 'ياسمين', needLabel: '💰 تمويل', governorate: 'الأقصر', views: 270, saves: 52, shares: 18, createdAt: Date.now() - (7*24*60*60*1000), status: 'published' },
  { id: 'demo_8', title: 'خدمة تنظيف منازل احترافية', desc: 'شركة تنظيف منازل بفريق مدرب.', author: 'نهى', needLabel: '💰🤝 تمويل أو شريك', governorate: 'القاهرة', views: 160, saves: 30, shares: 7, createdAt: Date.now() - (8*24*60*60*1000), status: 'published' }
];

const STORAGE_KEY = 'afkario_ideas_v1';

function getIdeas() {
  try {
    const stored = localStorage.getItem(STORAGE_KEY);
    if (stored) return JSON.parse(stored);
  } catch (e) {}
  localStorage.setItem(STORAGE_KEY, JSON.stringify(DEMO_IDEAS));
  return DEMO_IDEAS;
}

function renderStats() {
  const ideas = getIdeas().filter(i => i.status === 'published');
  const today = new Date().toDateString();
  const todayCount = ideas.filter(i => new Date(i.createdAt).toDateString() === today).length;
  document.getElementById('stat-total').textContent = ideas.length;
  document.getElementById('stat-today').textContent = todayCount;
  document.getElementById('stat-users').textContent = ideas.length;
}

function renderIdeas() {
  const ideas = getIdeas().filter(i => i.status === 'published').sort((a, b) => b.createdAt - a.createdAt);
  const grid = document.getElementById('ideas-grid');
  grid.innerHTML = ideas.map(idea => `
    <div class="idea-card" data-id="${idea.id}">
      <h3>${idea.title}</h3>
      <p class="desc">${idea.desc}</p>
      <div class="meta">
        <span class="tag tag-need">${idea.needLabel}</span>
        <span class="tag tag-loc">📍 ${idea.governorate}</span>
      </div>
      <div class="social">
        <span>👁️ ${idea.views}</span>
        <span>⭐ ${idea.saves}</span>
        <span>📤 ${idea.shares}</span>
      </div>
    </div>
  `).join('');
}

function init() {
  renderStats();
  renderIdeas();
const searchBtn = document.getElementById('btn-search');
  const searchBox = document.getElementById('search-box');
  const searchInput = document.getElementById('search-input');
  
  if (searchBtn && searchBox) {
    searchBtn.onclick = () => {
      const isVisible = searchBox.style.display !== 'none';
      searchBox.style.display = isVisible ? 'none' : 'block';
      if (!isVisible && searchInput) searchInput.focus();
    };
  }
  
  if (searchInput) {
    searchInput.addEventListener('input', (e) => {
      const query = e.target.value.trim().toLowerCase();
      const allIdeas = getIdeas().filter(i => i.status === 'published');
      
      let filtered = allIdeas;
      if (query) {
        filtered = allIdeas.filter(idea => {
          const hay = (idea.title + ' ' + idea.desc + ' ' + idea.author + ' ' + idea.governorate).toLowerCase();
          return hay.includes(query);
        });
      }
      
      filtered.sort((a, b) => b.createdAt - a.createdAt);
      const grid = document.getElementById('ideas-grid');
      
      if (!filtered.length) {
        grid.innerHTML = '<div class="empty" style="grid-column:1/-1"><span class="big">🔍</span>مفيش نتائج</div>';
        return;
      }
      
      grid.innerHTML = filtered.map(idea => `
        <div class="idea-card" data-id="${idea.id}">
          <h3>${idea.title}</h3>
          <p class="desc">${idea.desc}</p>
          <div class="meta">
            <span class="tag tag-need">${idea.needLabel}</span>
            <span class="tag tag-loc">📍 ${idea.governorate}</span>
          </div>
          <div class="social">
            <span>👁️ ${idea.views}</span>
            <span>⭐ ${idea.saves}</span>
            <span>📤 ${idea.shares}</span>
          </div>
        </div>
      `).join('');
    });
  }
  document.addEventListener('click', (e) => {
    const card = e.target.closest('.idea-card');
    if (card && card.dataset.id) openDetail(card.dataset.id);
  });
  const addBtn = document.getElementById('btn-add');
  if (addBtn) addBtn.onclick = openAdd;
}
// ========== فتح نموذج إضافة فكرة ==========
function openAdd() {
  const modal = document.createElement('div');
  modal.className = 'modal-overlay';
  modal.id = 'add-modal';
  
  modal.innerHTML = `
    <div class="modal-content">
      <button class="modal-close" onclick="closeAdd()">✕</button>
      
      <h2>💡 اكتب فكرتك</h2>
      <p class="modal-subtitle">احكي لنا فكرتك بطريقتك. مش لازم تكون خبير.</p>
      
      <div class="form-group">
        <label>عنوان الفكرة</label>
        <input type="text" id="f-title" placeholder="مثال: مطعم فول بلمسة عصرية" maxlength="80">

const SAVED_KEY = 'afkario_saved_v1';

function getSavedIds() {
  try {
    const stored = localStorage.getItem(SAVED_KEY);
    if (stored) return JSON.parse(stored);
  } catch (e) {}
  return [];
}

function isSaved(id) {
  return getSavedIds().includes(id);
}

function toggleSave(id) {
  const saved = getSavedIds();
  const index = saved.indexOf(id);
  if (index === -1) {
    saved.push(id);
    localStorage.setItem(SAVED_KEY, JSON.stringify(saved));
    return true;
  } else {
    saved.splice(index, 1);
    localStorage.setItem(SAVED_KEY, JSON.stringify(saved));
    return false;
  }
}

function openSaved() {
  renderSavedGrid();
  document.getElementById('saved-page').style.display = 'block';

<script>
// ========== تعديلات الدماغ — إيموجي ردود الفعل ==========
const REACTIONS_KEY = 'afkario_reactions_v1';
const REACTION_EMOJIS = ['😂', '👏', '🤝', '❤️', '🤯'];

function getReactions() {
  try {
    const stored = localStorage.getItem(REACTIONS_KEY);
    if (stored) return JSON.parse(stored);
  } catch (e) {}
  return {};
}

function saveReactions(data) {
  localStorage.setItem(REACTIONS_KEY, JSON.stringify(data));
}

function getIdeaReactions(ideaId) {
  const all = getReactions();
  return all[ideaId] || {};
}

function toggleReaction(ideaId, emoji) {
  const all = getReactions();
  if (!all[ideaId]) all[ideaId] = {};
  if (!all[ideaId][emoji]) all[ideaId][emoji] = 0;
  all[ideaId][emoji] += 1;
  saveReactions(all);
  return all[ideaId][emoji];
}

// إضافة شريط الإيموجي على كل كارت فكرة
function enhanceIdeaCards() {
  const cards = document.querySelectorAll('.idea-card');
  cards.forEach(card => {
    if (card.querySelector('.reactions-bar')) return;
    const id = card.dataset.id;
    if (!id) return;
    
    const reactions = getIdeaReactions(id);
    const bar = document.createElement('div');
    bar.className = 'reactions-bar';
    bar.style.cssText = 'display:flex; gap:6px; margin-top:10px; padding-top:8px; border-top:1px solid var(--border); justify-content:space-between;';
    
    let html = '';
    REACTION_EMOJIS.forEach(emoji => {
      const count = reactions[emoji] || 0;
      html += '<button class="react-btn" data-emoji="' + emoji + '" data-idea="' + id + '" style="background:none; border:none; font-size:0.85rem; display:flex; align-items:center; gap:3px; padding:4px 6px; border-radius:8px; font-weight:700; color:var(--text-mid); cursor:pointer;">' + emoji + (count ? ' ' + count : '') + '</button>';
    });
    
    bar.innerHTML = html;
    card.appendChild(bar);
  });
}

// معالج الضغط على الإيموجي
document.addEventListener('click', function(e) {
  const btn = e.target.closest('.react-btn');
  if (!btn) return;
  e.stopPropagation();
  e.preventDefault();
  
  const ideaId = btn.dataset.idea;
  const emoji = btn.dataset.emoji;
  const newCount = toggleReaction(ideaId, emoji);
  
  // تحديث الواجهة
  btn.innerHTML = emoji + ' ' + newCount;
  btn.style.background = '#FFF3CD';
  
  setTimeout(function() {
    btn.style.background = 'none';
  }, 500);
  
  toast('سجلنا رد فعلك ' + emoji);
});

// تحديث الكروت بعد أي render
document.addEventListener('DOMContentLoaded', function() {
  setTimeout(function() {
    enhanceIdeaCards();
    
    // مراقبة الشبكة لأي تحديث
    const grid = document.getElementById('ideas-grid');
    if (grid) {
      const observer = new MutationObserver(function() {
        enhanceIdeaCards();
      });
      observer.observe(grid, { childList: true, subtree: true });
    }
  }, 500);
});

// تحديث الكروت بعد فتح صفحة المحفوظات
const originalOpenSaved = window.openSaved;
if (typeof originalOpenSaved === 'function') {
  window.openSaved = function() {
    originalOpenSaved.apply(this, arguments);
    setTimeout(enhanceIdeaCards, 100);
  };
}

// تحديث الكروت بعد فتح صفحة "أنا"
const originalOpenMe = window.openMe;
if (typeof originalOpenMe === 'function') {
  window.openMe = function() {
    originalOpenMe.apply(this, arguments);
    setTimeout(enhanceIdeaCards, 100);
  };
}
</script>

// معالج أزرار الشريط
document.addEventListener('click', function(e) {
  const btn = e.target.closest('.action-btn');
  if (!btn) return;
  e.stopPropagation();
  e.preventDefault();
  
  const ideaId = btn.dataset.idea;
  const action = btn.dataset.act;
  const idea = getIdeas().find(i => i.id === ideaId);
  if (!idea) return;
  
  if (action === 'share') {
    const url = location.origin + location.pathname + '#idea=' + ideaId;
    const text = '💡 شوف الفكرة دي على مقهى الأفكار\n' + url;
    if (navigator.share) {
      navigator.share({ title: idea.title, text: text, url: url }).catch(function(){});
    } else {
      window.open('https://wa.me/?text=' + encodeURIComponent(text), '_blank');
    }
    toast('📤 شارك الفكرة');
  }
  
  if (action === 'repost') {
    const url = location.origin + location.pathname + '#idea=' + ideaId;

<script>
// ========== إعادة النشر الحقيقية ==========
const REPOSTS_KEY = 'afkario_reposts_v1';

function getReposts() {
  try {
    const stored = localStorage.getItem(REPOSTS_KEY);
    if (stored) return JSON.parse(stored);
  } catch (e) {}
  return {};
}

function saveReposts(data) {
  localStorage.setItem(REPOSTS_KEY, JSON.stringify(data));
}

function getIdeaReposts(ideaId) {
  const all = getReposts();
  return all[ideaId] || [];
}

function addRepost(ideaId, userName) {
  const all = getReposts();
  if (!all[ideaId]) all[ideaId] = [];
  if (!all[ideaId].includes(userName)) {
    all[ideaId].push(userName);
    saveReposts(all);
    return true;
  }
  return false;
}

// إضافة شريط "أعاد النشر" فوق الكارت
function enhanceWithReposts() {
  const cards = document.querySelectorAll('.idea-card');
  cards.forEach(card => {
    if (card.querySelector('.repost-badge')) return;
    const id = card.dataset.id;
    if (!id) return;
    
    const reposts = getIdeaReposts(id);
    if (reposts.length === 0) return;
    
    const badge = document.createElement('div');
    badge.className = 'repost-badge';
    badge.style.cssText = 'background:#E0F2FE; color:#075985; padding:6px 10px; border-radius:10px; font-size:0.7rem; font-weight:700; margin-bottom:8px; display:flex; align-items:center; gap:5px;';
    
    let names = reposts.slice(0, 3).join(' + ');
    if (reposts.length > 3) names += ' + ' + (reposts.length - 3) + ' آخرين';
    
    badge.innerHTML = '🔄 ' + names + ' أعادوا النشر';
    
    card.insertBefore(badge, card.firstChild);
  });
}

// تعديل زر 🔄 عشان يعمل إعادة نشر حقيقية
document.addEventListener('click', function(e) {
  const btn = e.target.closest('.action-btn[data-act="repost"]');
  if (!btn) return;
  e.stopPropagation();
  e.preventDefault();
  
  const ideaId = btn.dataset.idea;
  const userName = localStorage.getItem('afkario_my_name') || 'زائر';
  
  const added = addRepost(ideaId, userName);
  if (added) {
    toast('🔄 أعدت نشر الفكرة باسمك');
    enhanceWithReposts();

    toast('إنت معيد النشر بالفعل');

}, true);

// تحديث عند تحميل الصفحة
document.addEventListener('DOMContentLoaded', function() {

<script>
// ========== تعديلات الدماغ — الشريط السفلي الثابت + Explore ==========
(function() {
  
  // 1. نضيف زر Explore في الشريط السفلي (بدل أي زر زيادة)
  function ensureExploreButton() {
    const nav = document.querySelector('.bottom-nav');
    if (!nav) return;
    if (nav.querySelector('[data-page="explore"]')) return;
    
    // نغير الزر "البحث" — نعمل زرين: البحث + استكشاف
    // بس عشان مفيش مساحة، هنحول "البحث" الحالي لـ "استكشاف"
    // (البحث موجود في الهيدر بالفعل)
    const searchBtn = nav.querySelector('[data-page="search"]');
    if (searchBtn) {
      searchBtn.dataset.page = 'explore';
      searchBtn.innerHTML = '<span class="ic">🧭</span><span>استكشاف</span>';
    }
  }
  
  // 2. نعمل صفحة Explore
  function createExplorePage() {
    if (document.getElementById('explore-page')) return;
    
    const page = document.createElement('div');
    page.id = 'explore-page';
    page.style.cssText = 'display:none; position:fixed; inset:0; background:var(--bg); z-index:150; overflow-y:auto; padding:20px 16px 130px;';
    page.innerHTML = `
      <button onclick="closeExplore()" style="background:var(--white); border:1px solid var(--border); width:40px; height:40px; border-radius:50%; font-size:1.2rem; margin-bottom:20px; cursor:pointer;">←</button>
      <h1 style="font-size:1.4rem; font-weight:900; color:var(--text); margin:0 0 6px;">🧭 استكشاف</h1>
      <p style="color:var(--text-mid); font-size:0.9rem; margin:0 0 20px;">تصفح أفكار عشوائية من كل التصنيفات</p>
      
      <div id="explore-filters" style="display:flex; flex-wrap:wrap; gap:6px; margin-bottom:20px;">
        <button class="explore-chip active" data-explore-cat="" style="padding:7px 14px; border-radius:20px; background:var(--blue); color:white; font-size:0.82rem; font-weight:700; border:none;">الكل</button>
        <button class="explore-chip" data-explore-cat="food" style="padding:7px 14px; border-radius:20px; background:var(--bg-soft); color:var(--text-mid); font-size:0.82rem; font-weight:700; border:none;">🍔 أكل</button>
        <button class="explore-chip" data-explore-cat="tech" style="padding:7px 14px; border-radius:20px; background:var(--bg-soft); color:var(--text-mid); font-size:0.82rem; font-weight:700; border:none;">💻 تكنولوجيا</button>
        <button class="explore-chip" data-explore-cat="services" style="padding:7px 14px; border-radius:20px; background:var(--bg-soft); color:var(--text-mid); font-size:0.82rem; font-weight:700; border:none;">🧑‍🔧 خدمات</button>
        <button class="explore-chip" data-explore-cat="women" style="padding:7px 14px; border-radius:20px; background:var(--bg-soft); color:var(--text-mid); font-size:0.82rem; font-weight:700; border:none;">💖 أعمال السيدات</button>
      </div>
      
      <div id="explore-grid" style="display:grid; grid-template-columns:1fr 1fr; gap:12px;"></div>
    `;
    document.body.appendChild(page);
  }
  
  // 3. عرض أفكار Explore
  function renderExplore(category) {
    const grid = document.getElementById('explore-grid');
    if (!grid) return;
    
    let ideas = getIdeas().filter(i => i.status === 'published');
    
    // لو في تصنيف محدد، نستخدمه
    if (category) {
      // بنحاول نعمل match بسيط
      const catMap = {
        'food': '🍔',
        'tech': '💻',
        'services': '🧑‍🔧',
        'women': '💖'
      };
      const emoji = catMap[category];
      if (emoji) {
        ideas = ideas.filter(i => i.needLabel && i.needLabel.includes(emoji) || 
          (i.title && i.title.includes('تكنولوجيا')) ||
          (i.title && i.title.includes('أكل')) ||
          (i.title && i.title.includes('نساء'))
        );
      }
    }
    
    if (!ideas.length) {
      grid.innerHTML = '<div style="grid-column:1/-1; text-align:center; padding:40px 20px; color:var(--text-mid);">مفيش أفكار هنا</div>';
      return;
    }
    
    // عشوائي
    ideas = ideas.sort(() => Math.random() - 0.5);
    
    grid.innerHTML = ideas.map(idea => `
      <div class="idea-card" data-id="${idea.id}" onclick="if(typeof openDetail === 'function') openDetail('${idea.id}')">
        <h3>${idea.title}</h3>
        <p class="desc">${idea.desc}</p>
        <div class="meta">
          <span class="tag tag-need">${idea.needLabel}</span>
          <span class="tag tag-loc">📍 ${idea.governorate}</span>
        </div>
        <div class="social">
          <span>👁️ ${idea.views}</span>
          <span>⭐ ${idea.saves}</span>
          <span>📤 ${idea.shares}</span>
        </div>
      </div>
    `).join('');
  }
  
  // 4. فتح صفحة Explore
  window.openExplore = function() {
    createExplorePage();
    renderExplore('');
    document.getElementById('explore-page').style.display = 'block';
    document.body.style.overflow = 'hidden';
  };
  
  window.closeExplore = function() {
    const page = document.getElementById('explore-page');
    if (page) page.style.display = 'none';
    document.body.style.overflow = '';
  };
  
  // 5. ربط الزر
  document.addEventListener('DOMContentLoaded', function() {
    setTimeout(function() {
      ensureExploreButton();
      
      // ربط زر Explore
      const exploreBtn = document.querySelector('.bottom-nav [data-page="explore"]');
      if (exploreBtn) {
        exploreBtn.onclick = function(e) {
          e.preventDefault();
          openExplore();
        };
      }
      
      // ربط فلاتر Explore
      document.addEventListener('click', function(e) {
        const chip = e.target.closest('.explore-chip');
        if (!chip) return;
        document.querySelectorAll('.explore-chip').forEach(c => {
          c.style.background = 'var(--bg-soft)';
          c.style.color = 'var(--text-mid)';
          c.classList.remove('active');
        });
        chip.style.background = 'var(--blue)';
        chip.style.color = 'white';
        chip.classList.add('active');
        renderExplore(chip.dataset.exploreCat || '');
      });
    }, 400);
  });
  
})();
</script>

        <input type="checkbox" id="ep-show-wa" ${currentShowWA ? 'checked' : ''} style="width:auto; transform:scale(1.3);">
      </div>

      <div style="margin-bottom:20px;">
        <label style="display:block; font-weight:800; color:var(--text); font-size:0.9rem; margin-bottom:6px;">💬 نبذة عنك</label>
        <textarea id="ep-bio" placeholder="اكتب جملة قصيرة عنك..." maxlength="140" style="width:100%; padding:13px 14px; border-radius:12px; border:1.5px solid var(--border); background:var(--white); font-family:inherit; font-size:1rem; color:var(--text); box-sizing:border-box; min-height:80px; resize:vertical;">${currentBio}</textarea>
      </div>

      <button id="ep-save" style="width:100%; background:linear-gradient(135deg, var(--blue), #2b6fd9); color:white; padding:16px; border-radius:14px; font-size:1rem; font-weight:800; border:none; cursor:pointer;">✅ حفظ التعديلات</button>
    `;

    // اختيار الصورة الرمزية
    let selectedAvatar = currentAvatar;
    document.querySelectorAll('.avatar-choice').forEach(btn => {
      btn.onclick = function() {
        selectedAvatar = btn.dataset.emoji;
        document.querySelectorAll('.avatar-choice').forEach(b => {
          b.style.background = 'var(--white)';
          b.style.borderColor = 'var(--border)';
        });
        btn.style.background = 'var(--blue)';
        btn.style.borderColor = 'var(--blue)';
      };
    });

    // حفظ
    document.getElementById('ep-save').onclick = function() {
      const name = document.getElementById('ep-name').value.trim();
      const wa = document.getElementById('ep-wa').value.trim();
      const showWA = document.getElementById('ep-show-wa').checked;
      const bio = document.getElementById('ep-bio').value.trim();

      if (name.length < 2) {
        if (typeof toast === 'function') toast('اكتب اسمك');
        return;
      }

      localStorage.setItem('afkario_my_avatar', selectedAvatar);
      localStorage.setItem('afkario_my_name', name);
      localStorage.setItem('afkario_my_whatsapp', wa);
      localStorage.setItem('afkario_my_show_wa', showWA ? 'true' : 'false');
      localStorage.setItem('afkario_my_bio', bio);

      if (typeof toast === 'function') toast('✅ اتحفظت التعديلات');
      closeEditProfile();
      
      // إعادة فتح البروفايل
      setTimeout(function() {
        if (typeof openProfile === 'function') openProfile();
      }, 300);
    };
  }

  window.openEditProfile = function() {
    createEditProfilePage();
    renderEditProfileForm();
    document.getElementById('edit-profile-page').style.display = 'block';
    document.body.style.overflow = 'hidden';
  };

  window.closeEditProfile = function() {
    const page = document.getElementById('edit-profile-page');
    if (page) page.style.display = 'none';
    document.body.style.overflow = '';
  };

  // 3. تعديل renderProfile عشان يظهر الصورة الرمزية + Bio + زر التعديل
  const _origRenderProfile = window.renderProfile;
  
  // 4. ربط الكروت في البروفايل
  function enhanceProfileCards() {
    // ربط الضغط
    document.querySelectorAll('#profile-content .idea-card, #me-content .idea-card').forEach(card => {
      if (card.dataset.bound === 'true') return;
      card.dataset.bound = 'true';
      card.onclick = function() {
        const id = card.dataset.id;
        if (id && typeof openDetail === 'function') {
          openDetail(id);
        }
      };
    });
    
    // إضافة إيموجي + شريط التفاعل
    if (typeof enhanceIdeaCards === 'function') enhanceIdeaCards();
    if (typeof enhanceWithActionBar === 'function') enhanceWithActionBar();
    if (typeof enhanceWithReposts === 'function') enhanceWithReposts();
  }

  // 5. بعد فتح البروفايل → نحسّن الكروت
  document.addEventListener('DOMContentLoaded', function() {
    setTimeout(function() {
      const origOpen = window.openProfile;
      if (typeof origOpen === 'function') {
        window.openProfile = function() {
          origOpen.apply(this, arguments);
          setTimeout(enhanceProfileCards, 300);
        };
      }
    }, 800);
  });

})();
</script>

<script>
// ========== تعديلات الدماغ — تحسين البروفايل بالصورة الرمزية ==========
(function() {

  function enhanceProfileWithAvatar() {
    const content = document.getElementById('profile-content') || document.getElementById('me-content');
    if (!content) return;

    // الصورة الرمزية
    const avatar = localStorage.getItem('afkario_my_avatar') || '';
    const name = localStorage.getItem('afkario_my_name') || '';
    const whatsapp = localStorage.getItem('afkario_my_whatsapp') || '';
    const showWA = localStorage.getItem('afkario_my_show_wa') !== 'false';
    const bio = localStorage.getItem('afkario_my_bio') || '';

    // 1. استبدال الحرف الأول بالإيموجي (لو موجود)
    if (avatar) {
      const circles = content.querySelectorAll('div[style*="border-radius:50%"][style*="background:linear-gradient"]');
      circles.forEach(c => {
        if (c.textContent.trim().length <= 2) {
          c.textContent = avatar;
        }
      });
    }

    // 2. إضافة Bio تحت الاسم
    if (bio && name) {
      const nameHeading = content.querySelector('h2');
      if (nameHeading && !nameHeading.nextElementSibling?.classList?.contains('profile-bio')) {
        const bioEl = document.createElement('p');
        bioEl.className = 'profile-bio';
        bioEl.style.cssText = 'color:var(--text-mid); font-size:0.9rem; margin:0 0 10px; text-align:center;';
        bioEl.textContent = bio;
        nameHeading.parentNode.insertBefore(bioEl, nameHeading.nextSibling);
      }
    }

    // 3. إضافة زر "تعديل" بجانب الاسم
    const nameHeading = content.querySelector('h2');
    if (nameHeading && !content.querySelector('.edit-profile-btn')) {
      const editBtn = document.createElement('button');
      editBtn.className = 'edit-profile-btn';
      editBtn.textContent = '✏️ تعديل';
      editBtn.style.cssText = 'display:block; margin:0 auto 12px; background:var(--white); border:1.5px solid var(--border); color:var(--text); padding:8px 16px; border-radius:20px; font-size:0.82rem; font-weight:700; cursor:pointer;';
      editBtn.onclick = function() {
        if (typeof openEditProfile === 'function') openEditProfile();
      };
      nameHeading.parentNode.insertBefore(editBtn, nameHeading.nextSibling);
    }

    // 4. عرض زر الواتساب (لو موجود + للعامة)
    const waBtn = content.querySelector('a[href*="wa.me"]');
    if (!waBtn && whatsapp && showWA && name) {
      const waLink = document.createElement('a');
      waLink.href = 'https://wa.me/' + whatsapp.replace(/\D/g, '');
      waLink.target = '_blank';
      waLink.textContent = '📲 واتساب';
      waLink.style.cssText = 'display:inline-block; background:#25D366; color:white; padding:10px 20px; border-radius:12px; font-size:0.85rem; font-weight:700; text-decoration:none; margin:8px auto 0;';
      const nameContainer = nameHeading?.parentNode;
      if (nameContainer) {
        nameContainer.appendChild(document.createElement('br'));
        nameContainer.appendChild(waLink);
      }
    }

    // 5. ربط كروت البروفايل بـ openDetail
    content.querySelectorAll('.idea-card').forEach(card => {
      if (card.dataset.bound === 'true') return;
      card.dataset.bound = 'true';
      card.style.cursor = 'pointer';
      card.onclick = function() {
        const id = card.dataset.id;
        if (id && typeof openDetail === 'function') openDetail(id);
      };
    });
  }

  // تشغيل بعد فتح البروفايل
  document.addEventListener('DOMContentLoaded', function() {
    setTimeout(function() {
      const origOpen = window.openProfile;
      if (typeof origOpen === 'function' && !origOpen._enhanced) {
        const enhanced = function() {
          origOpen.apply(this, arguments);
          setTimeout(enhanceProfileWithAvatar, 400);
        };
        enhanced._enhanced = true;
        window.openProfile = enhanced;
      }
    }, 1200);
  });

})();
</script>

<script>
// ========== تعديلات الدماغ — إصلاح الرقم + ربط الكروت في كل مكان ==========
(function() {

  // 1. إصلاح الرقم المعكوس (dir="ltr")
  function fixWhatsappNumber() {
    // كل عنصر فيه رقم واتساب أو علامة +
    const all = document.querySelectorAll('#profile-content, #me-content, #saved-page');
    all.forEach(container => {
      container.querySelectorAll('p, span, div, a').forEach(el => {
        if (el.children.length === 0) {
          const text = (el.textContent || '').trim();
          if (text.startsWith('+') || /^\+\d+/.test(text) || /^\d{10,}/.test(text)) {
            el.setAttribute('dir', 'ltr');
            el.style.direction = 'ltr';
            el.style.unicodeBidi = 'embed';
          }
        }
      });
    });
  }

  // 2. ربط كل الكروت في كل الصفحات بـ openDetail
  function bindAllCards() {
    const containers = document.querySelectorAll(
      '#profile-content, #me-content, #saved-page, #explore-page, #ideas-grid'
    );
    
    containers.forEach(container => {
      container.querySelectorAll('.idea-card').forEach(card => {
        // شيل الربط القديم
        if (card.dataset.finalBound === 'true') return;
        card.dataset.finalBound = 'true';
        card.style.cursor = 'pointer';
        
        card.addEventListener('click', function(e) {
          // متشتغلش لو الضغط على زر
          if (e.target.closest('button') || e.target.closest('a')) return;
          
          const id = card.dataset.id;
          if (id && typeof openDetail === 'function') {
            openDetail(id);
          }
        });
      });
    });
  }

  // 3. تشغيل الدوال بعد كل فتح صفحة
  function runFixes() {
    fixWhatsappNumber();
    bindAllCards();
  }

  // عند تحميل الصفحة
  document.addEventListener('DOMContentLoaded', function() {
    setTimeout(runFixes, 1000);
    
    // observer للشبكة الرئيسية
    const grid = document.getElementById('ideas-grid');
    if (grid) {
      new MutationObserver(runFixes).observe(grid, { childList: true, subtree: true });
    }
  });

  // بعد فتح البروفايل
  const _origOpenProfile = window.openProfile;
  if (typeof _origOpenProfile === 'function' && !_origOpenProfile._fixed) {
    const fixed = function() {
      _origOpenProfile.apply(this, arguments);
      setTimeout(runFixes, 500);
    };
    fixed._fixed = true;
    window.openProfile = fixed;
  }

  // بعد فتح المحفوظات
  const _origOpenSaved = window.openSaved;
  if (typeof _origOpenSaved === 'function' && !_origOpenSaved._fixed) {
    const fixed = function() {
      _origOpenSaved.apply(this, arguments);
      setTimeout(runFixes, 400);
    };
    fixed._fixed = true;
    window.openSaved = fixed;
  }

  // بعد فتح الاستكشاف
  const _origOpenExplore = window.openExplore;
  if (typeof _origOpenExplore === 'function' && !_origOpenExplore._fixed) {
    const fixed = function() {
      _origOpenExplore.apply(this, arguments);
      setTimeout(runFixes, 400);
    };
    fixed._fixed = true;
    window.openExplore = fixed;
  }

  // بعد فتح "أنا" (القديمة)
  const _origOpenMe = window.openMe;
  if (typeof _origOpenMe === 'function' && !_origOpenMe._fixed) {
    const fixed = function() {
      _origOpenMe.apply(this, arguments);
      setTimeout(runFixes, 400);
    };
    fixed._fixed = true;
    window.openMe = fixed;
  }

})();
</script>

<script>
// ========== إخفاء رقم الواتساب من البروفايل ==========
(function() {

  function hideWhatsappNumber() {
    const containers = document.querySelectorAll('#profile-content, #me-content, #saved-page, #explore-page, #ideas-grid');
    containers.forEach(container => {
      container.querySelectorAll('p, span, div').forEach(el => {
        if (el.children.length > 0) return;
        const text = (el.textContent || '').trim();
        // لو النص رقم واتساب (يبدأ بـ + أو 10 أرقام+)
        if (/^\+?\d{10,}$/.test(text)) {
          el.style.display = 'none';
        }
      });
    });
  }

  document.addEventListener('DOMContentLoaded', function() {
    setTimeout(hideWhatsappNumber, 1200);
    
    // إعادة التشغيل بعد فتح البروفايل
    const _origOpen = window.openProfile;
    if (typeof _origOpen === 'function' && !_origOpen._hid) {
      const hid = function() {
        _origOpen.apply(this, arguments);
        setTimeout(hideWhatsappNumber, 500);
      };
      hid._hid = true;
      window.openProfile = hid;
    }
  });

})();
</script>
