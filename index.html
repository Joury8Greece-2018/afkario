<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>

<style>
  /* ========== المتغيرات ========== */
  :root {
    --blue: #4285F4;
    --green: #34A853;
    --yellow: #FBBC04;
    --orange: #FF6D00;
    --pink: #FF4FCB;
    --bg: #FAFAFA;
    --bg-soft: #F5F5F7;
    --white: #FFFFFF;
    --border: #E5E7EB;
    --text: #1C1C1E;
    --text-soft: #8E8E8E;
    --text-mid: #4B5563;
    --shadow: 0 1px 3px rgba(0,0,0,.05), 0 1px 2px rgba(0,0,0,.03);
    --radius: 16px;
  }

  * {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
  }

  html, body {
    margin: 0;
    padding: 0;
    background: var(--bg);
  }

  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Tahoma, Arial, sans-serif;
    color: var(--text);
    direction: rtl;
    text-align: right;
    line-height: 1.6;
    min-height: 100vh;
    padding-bottom: 90px;
    font-size: 15px;
  }

  a { color: var(--blue); text-decoration: none; }
  button { font-family: inherit; cursor: pointer; border: none; background: none; color: inherit; }
  img { max-width: 100%; display: block; }

  /* ========== الهيدر ========== */
  .app-header {
    background: var(--white);
    border-bottom: 1px solid var(--border);
    padding: 12px 16px;
    position: sticky;
    top: 0;
    z-index: 40;
  }
  .header-row {
    max-width: 640px;
    margin: 0 auto;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
  }
  .logo-box {
    width: 40px;
    height: 40px;
    border-radius: 10px;
    overflow: hidden;
    flex-shrink: 0;
  }
  .logo-box img { width: 100%; height: 100%; }
  .brand-title {
    font-size: 1.15rem;
    font-weight: 800;
    color: var(--text);
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .header-icon {
    width: 40px;
    height: 40px;
    border-radius: 50%;
    background: var(--bg-soft);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 1.1rem;
  }

  /* ========== الحاوية ========== */
  .wrap {
    max-width: 640px;
    margin: 0 auto;
    padding: 0 16px;
  }

  /* ========== الهيرو ========== */
  .hero {
    text-align: center;
    padding: 32px 0 24px;
  }
  .hero h1 {
    font-size: 1.7rem;
    font-weight: 900;
    color: var(--text);
    margin: 0 0 10px;
    line-height: 1.3;
  }
  .hero p {
    font-size: 0.98rem;
    color: var(--text-mid);
    margin: 0 0 16px;
  }
  .badge-gradient {
    display: inline-block;
    background: linear-gradient(135deg, var(--yellow), var(--orange));
    color: var(--white);
    padding: 8px 22px;
    border-radius: 24px;
    font-weight: 800;
    font-size: 0.95rem;
    box-shadow: 0 4px 12px rgba(255,109,0,.25);
  }

  /* ========== الأزرار الرئيسية ========== */
  .main-actions {
    display: flex;
    gap: 10px;
    margin: 20px 0;
  }
  .btn {
    flex: 1;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    padding: 14px 18px;
    border-radius: 14px;
    font-size: 1rem;
    font-weight: 800;
    transition: transform .08s ease;
  }
  .btn:active { transform: scale(.97); }
  .btn-primary {
    background: linear-gradient(135deg, var(--blue), #2b6fd9);
    color: var(--white);
    box-shadow: 0 4px 12px rgba(66,133,244,.25);
  }
  .btn-secondary {
    background: var(--white);
    color: var(--text);
    border: 1.5px solid var(--border);
  }
  .btn-block { width: 100%; }

  /* ========== الإحصائيات ========== */
  .stats {
    display: flex;
    gap: 10px;
    margin: 16px 0;
  }
  .stat {
    flex: 1;
    background: var(--white);
    border-radius: var(--radius);
    padding: 14px 10px;
    text-align: center;
    box-shadow: var(--shadow);
    border: 1px solid var(--border);
  }
  .stat .num {
    font-size: 1.5rem;
    font-weight: 900;
    color: var(--blue);
  }
  .stat .lbl {
    font-size: 0.78rem;
    color: var(--text-mid);
    margin-top: 2px;
    font-weight: 600;
  }

  /* ========== الشريط السفلي ========== */
  .bottom-nav {
    position: fixed;
    bottom: 0;
    left: 0;
    right: 0;
    background: var(--white);
    border-top: 1px solid var(--border);
    display: flex;
    justify-content: space-around;
    padding: 8px 0 max(8px, env(safe-area-inset-bottom));
    z-index: 50;
  }
  .bottom-nav button {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 2px;
    color: var(--text-soft);
    font-size: 0.7rem;
    padding: 6px 4px;
    font-weight: 700;
  }
  .bottom-nav button.active { color: var(--blue); }
  .bottom-nav .ic { font-size: 1.25rem; line-height: 1; }
</style>
</head>
<body>

<style>
  .ideas-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin: 20px 0; }
  .idea-card { background: var(--white); border-radius: 14px; padding: 14px; border: 1px solid var(--border); box-shadow: var(--shadow); cursor: pointer; }
  .idea-card:active { transform: scale(.98); }
  .idea-card h3 { margin: 0 0 6px; font-size: 0.95rem; font-weight: 800; color: var(--text); line-height: 1.35; }
  .idea-card .desc { font-size: 0.78rem; color: var(--text-mid); margin: 0 0 10px; line-height: 1.4; min-height: 2.2em; }
  .idea-card .meta { display: flex; flex-wrap: wrap; gap: 4px; margin-bottom: 8px; }
  .idea-card .tag { font-size: 0.68rem; font-weight: 700; padding: 3px 8px; border-radius: 10px; }
  .tag-need { background: #FFF3CD; color: #856404; }
  .tag-loc { background: #EDE9FE; color: #5B21B6; }
  .idea-card .social { display: flex; gap: 8px; font-size: 0.72rem; color: var(--text-soft); font-weight: 600; padding-top: 8px; border-top: 1px solid var(--border); }
  .section-head { display: flex; justify-content: space-between; margin: 24px 0 12px; }
  .section-head h2 { font-size: 1.05rem; font-weight: 800; color: var(--text); margin: 0; }
  .empty { text-align: center; padding: 40px 20px; color: var(--text-mid); }
  .empty .big { font-size: 2.5rem; display: block; margin-bottom: 10px; }
/* ========== Modal (تفاصيل الفكرة) ========== */
  .modal-overlay {
    position: fixed;
    inset: 0;
    background: rgba(0, 0, 0, 0.6);
    z-index: 100;
    display: flex;
    align-items: flex-end;
    justify-content: center;
    animation: fadeIn 0.2s ease;
  }

  @keyframes fadeIn {
    from { opacity: 0; }
    to { opacity: 1; }
  }

  .modal-content {
    background: var(--white);
    width: 100%;
    max-width: 640px;
    max-height: 90vh;
    overflow-y: auto;
    border-top-left-radius: 24px;
    border-top-right-radius: 24px;
    padding: 24px 20px 30px;
    position: relative;
    animation: slideUp 0.3s ease;
  }

  @keyframes slideUp {
    from { transform: translateY(40px); opacity: 0; }
    to { transform: translateY(0); opacity: 1; }
  }

  .modal-close {
    position: absolute;
    top: 16px;
    left: 16px;
    width: 36px;
    height: 36px;
    border-radius: 50%;
    background: var(--bg-soft);
    font-size: 1rem;
    font-weight: 800;
    color: var(--text-mid);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 2;
  }

  .modal-content h2 {
    font-size: 1.4rem;
    font-weight: 900;
    color: var(--text);
    margin: 0 0 12px;
    padding-left: 50px;
    line-height: 1.3;
  }

  .modal-meta {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    margin-bottom: 20px;
  }

  .modal-meta .tag {
    font-size: 0.78rem;
    font-weight: 700;
    padding: 5px 12px;
    border-radius: 12px;
  }

  .modal-section {
    margin-bottom: 20px;
  }

  .modal-section h3 {
    font-size: 0.85rem;
    font-weight: 800;
    color: var(--text-mid);
    margin: 0 0 6px;
  }

  .modal-section p {
    font-size: 1rem;
    color: var(--text);
    line-height: 1.6;
    margin: 0;
  }

  .modal-social {
    display: flex;
    gap: 16px;
    padding: 14px 0;
    border-top: 1px solid var(--border);
    border-bottom: 1px solid var(--border);
    font-size: 0.9rem;
    color: var(--text-mid);
    font-weight: 700;
    margin-bottom: 20px;
  }

  .modal-actions {
    display: flex;
    gap: 10px;
  }

  .modal-actions .btn {
    flex: 1;
  }

  /* ========== Toast ========== */
  .toast {
    position: fixed;
    bottom: 100px;
    left: 50%;
    transform: translateX(-50%) translateY(20px);
    background: var(--text);
    color: var(--white);
    padding: 12px 24px;
    border-radius: 24px;
    font-size: 0.9rem;
    font-weight: 700;
    z-index: 200;
    opacity: 0;
    transition: all 0.3s ease;
    pointer-events: none;
    max-width: 90vw;
    text-align: center;
    box-shadow: 0 4px 20px rgba(0, 0, 0, 0.2);
  }

  .toast.show {
    opacity: 1;
    transform: translateX(-50%) translateY(0);
  }/* ========== خانة البحث ========== */
  .search-box {
    margin: 16px 0;
  }

  .search-box input {
    width: 100%;
    padding: 14px 16px;
    border-radius: 14px;
    border: 1.5px solid var(--border);
    background: var(--white);
    font-family: inherit;
    font-size: 1rem;
    color: var(--text);
    box-sizing: border-box;
  }

  .search-box input:focus {
    outline: none;
    border-color: var(--blue);
  }
  /* ========== نموذج الإضافة ========== */
  .modal-subtitle {
    font-size: 0.9rem;
    color: var(--text-mid);
    margin: 0 0 20px;
    padding-left: 50px;
  }

  .form-group {
    margin-bottom: 16px;
  }

  .form-group label {
    display: block;
    font-weight: 700;
    color: var(--text-mid);
    font-size: 0.85rem;
    margin-bottom: 6px;
  }

  .form-group input,
  .form-group textarea,
  .form-group select {
    width: 100%;
    padding: 13px 14px;
    border-radius: 12px;
    border: 1.5px solid var(--border);
    background: var(--white);
    font-family: inherit;
    font-size: 1rem;
    color: var(--text);
    box-sizing: border-box;
  }

  .form-group input:focus,
  .form-group textarea:focus,
  .form-group select:focus {
    outline: none;
    border-color: var(--blue);
  }

  .form-group textarea {
    min-height: 100px;
    resize: vertical;
  }
</style>
<script>
const DEMO_IDEAS = [
  { id: 'demo_1', title: 'صالون رجالي متنقل', desc: 'صالون رجالي بييجي لحد البيت أو الشغل.', author: 'أحمد', needLabel: '💰 تمويل', governorate: 'القاهرة', views: 250, saves: 40, shares: 12, createdAt: Date.now() - (1*24*60*60*1000), status: 'published' },
  { id: 'demo_2', title: 'مطعم فول وطعمية بلمسة جديدة', desc: 'فول وطعمية بس بشكل عصري ونظيف.', author: 'منى', needLabel: '🤝 شريك', governorate: 'الجيزة', views: 180, saves: 32, shares: 8, createdAt: Date.now() - (2*24*60*60*1000), status: 'published' },
  { id: 'demo_3', title: 'جيم صغير للنساء', desc: 'جيم مخصص للنساء فقط، بمدربات.', author: 'سارة', needLabel: '💰 تمويل', governorate: 'الإسكندرية', views: 320, saves: 65, shares: 22, createdAt: Date.now() - (3*24*60*60*1000), status: 'published' },
  { id: 'demo_4', title: 'متجر ملابس أونلاين', desc: 'متجر ملابس شبابية أونلاين.', author: 'هدى', needLabel: '💰🤝 تمويل أو شريك', governorate: 'القاهرة', views: 145, saves: 28, shares: 5, createdAt: Date.now() - (4*24*60*60*1000), status: 'published' },
  { id: 'demo_5', title: 'تطبيق حجز مواعيد الدكتور', desc: 'تطبيق بسيط يحجز مواعيد الدكتور.', author: 'محمود', needLabel: '🤝 شريك', governorate: 'القاهرة', views: 210, saves: 45, shares: 15, createdAt: Date.now() - (5*24*60*60*1000), status: 'published' },
  { id: 'demo_6', title: 'مشروع زراعة أسطح', desc: 'استغلال أسطح المباني في زراعة خضروات.', author: 'كريم', needLabel: '👥 حد يساعدني', governorate: 'القاهرة', views: 95, saves: 18, shares: 4, createdAt: Date.now() - (6*24*60*60*1000), status: 'published' },
  { id: 'demo_7', title: 'رحلات سياحية داخلية', desc: 'رحلات سياحية للشباب داخل مصر.', author: 'ياسمين', needLabel: '💰 تمويل', governorate: 'الأقصر', views: 270, saves: 52, shares: 18, createdAt: Date.now() - (7*24*60*60*1000), status: 'published' },
  { id: 'demo_8', title: 'خدمة تنظيف منازل احترافية', desc: 'شركة تنظيف منازل بفريق مدرب.', author: 'نهى', needLabel: '💰🤝 تمويل أو شريك', governorate: 'القاهرة', views: 160, saves: 30, shares: 7, createdAt: Date.now() - (8*24*60*60*1000), status: 'published' }
];

const STORAGE_KEY = 'afkario_ideas_v1';

function getIdeas() {
  try {
    const stored = localStorage.getItem(STORAGE_KEY);
    if (stored) return JSON.parse(stored);
  } catch (e) {}
  localStorage.setItem(STORAGE_KEY, JSON.stringify(DEMO_IDEAS));
  return DEMO_IDEAS;
}

function renderStats() {
  const ideas = getIdeas().filter(i => i.status === 'published');
  const today = new Date().toDateString();
  const todayCount = ideas.filter(i => new Date(i.createdAt).toDateString() === today).length;
  document.getElementById('stat-total').textContent = ideas.length;
  document.getElementById('stat-today').textContent = todayCount;
  document.getElementById('stat-users').textContent = ideas.length;
}

function renderIdeas() {
  const ideas = getIdeas().filter(i => i.status === 'published').sort((a, b) => b.createdAt - a.createdAt);
  const grid = document.getElementById('ideas-grid');
  grid.innerHTML = ideas.map(idea => `
    <div class="idea-card" data-id="${idea.id}">
      <h3>${idea.title}</h3>
      <p class="desc">${idea.desc}</p>
      <div class="meta">
        <span class="tag tag-need">${idea.needLabel}</span>
        <span class="tag tag-loc">📍 ${idea.governorate}</span>
      </div>
      <div class="social">
        <span>👁️ ${idea.views}</span>
        <span>⭐ ${idea.saves}</span>
        <span>📤 ${idea.shares}</span>
      </div>
    </div>
  `).join('');
}

function init() {
  renderStats();
  renderIdeas();
const searchBtn = document.getElementById('btn-search');
  const searchBox = document.getElementById('search-box');
  const searchInput = document.getElementById('search-input');
  
  if (searchBtn && searchBox) {
    searchBtn.onclick = () => {
      const isVisible = searchBox.style.display !== 'none';
      searchBox.style.display = isVisible ? 'none' : 'block';
      if (!isVisible && searchInput) searchInput.focus();
    };
  }
  
  if (searchInput) {
    searchInput.addEventListener('input', (e) => {
      const query = e.target.value.trim().toLowerCase();
      const allIdeas = getIdeas().filter(i => i.status === 'published');
      
      let filtered = allIdeas;
      if (query) {
        filtered = allIdeas.filter(idea => {
          const hay = (idea.title + ' ' + idea.desc + ' ' + idea.author + ' ' + idea.governorate).toLowerCase();
          return hay.includes(query);
        });
      }
      
      filtered.sort((a, b) => b.createdAt - a.createdAt);
      const grid = document.getElementById('ideas-grid');
      
      if (!filtered.length) {
        grid.innerHTML = '<div class="empty" style="grid-column:1/-1"><span class="big">🔍</span>مفيش نتائج</div>';
        return;
      }
      
      grid.innerHTML = filtered.map(idea => `
        <div class="idea-card" data-id="${idea.id}">
          <h3>${idea.title}</h3>
          <p class="desc">${idea.desc}</p>
          <div class="meta">
            <span class="tag tag-need">${idea.needLabel}</span>
            <span class="tag tag-loc">📍 ${idea.governorate}</span>
          </div>
          <div class="social">
            <span>👁️ ${idea.views}</span>
            <span>⭐ ${idea.saves}</span>
            <span>📤 ${idea.shares}</span>
          </div>
        </div>
      `).join('');
    });
  }
  document.addEventListener('click', (e) => {
    const card = e.target.closest('.idea-card');
    if (card && card.dataset.id) openDetail(card.dataset.id);
  });
  const addBtn = document.getElementById('btn-add');
  if (addBtn) addBtn.onclick = openAdd;
}
// ========== فتح نموذج إضافة فكرة ==========
function openAdd() {
  const modal = document.createElement('div');
  modal.className = 'modal-overlay';
  modal.id = 'add-modal';
  
  modal.innerHTML = `
    <div class="modal-content">
      <button class="modal-close" onclick="closeAdd()">✕</button>
      
      <h2>💡 اكتب فكرتك</h2>
      <p class="modal-subtitle">احكي لنا فكرتك بطريقتك. مش لازم تكون خبير.</p>
      
      <div class="form-group">
        <label>عنوان الفكرة</label>
        <input type="text" id="f-title" placeholder="مثال: مطعم فول بلمسة عصرية" maxlength="80">

function submitAdd() {
  const title = document.getElementById('f-title').value.trim();

  const gov = document.getElementById('f-gov').value;

  if (title.length < 4) {

  if (desc.length < 15) {
    toast('اكتب وصف أطول شوية');
    return;
  }
  
  const newIdea = {

    title: title,
    desc: desc,
    author: author,
    needLabel: need,
    governorate: gov,
    views: 0,
    saves: 0,
    shares: 0,
    createdAt: Date.now(),
    status: 'published'
  };
  
  const ideas = getIdeas();
  ideas.unshift(newIdea);
  localStorage.setItem(STORAGE_KEY, JSON.stringify(ideas));
  
  closeAdd();
  renderStats();
  renderIdeas();
  toast('🎉 فكرتك وصلت للقهوة!');
}

  document.body.style.overflow = '';
}

// ========== Toast (رسالة سريعة) ==========
function toast(msg) {
  const t = document.createElement('div');
  t.className = 'toast';
  t.textContent = msg;
  document.body.appendChild(t);
  
  setTimeout(() => t.classList.add('show'), 10);
  setTimeout(() => {
    t.classList.remove('show');
    setTimeout(() => t.remove(), 300);
  }, 2500);
}

<div id="saved-page" style="display:none; position:fixed; inset:0; background:var(--bg); z-index:150; overflow-y:auto; padding:20px 16px 100px;">
  <button onclick="closeSaved()" style="background:var(--white); border:1px solid var(--border); width:40px; height:40px; border-radius:50%; font-size:1.2rem; margin-bottom:20px;">←</button>
  <h1 style="font-size:1.4rem; font-weight:900; color:var(--text); margin:0 0 20px;">⭐ المحفوظات</h1>
  <div id="saved-grid" style="display:grid; grid-template-columns:1fr 1fr; gap:12px;"></div>
</div>

<script>
// ========== دوال المحفوظات ==========
const SAVED_KEY = 'afkario_saved_v1';

function getSavedIds() {
  try {
    const stored = localStorage.getItem(SAVED_KEY);
    if (stored) return JSON.parse(stored);
  } catch (e) {}
  return [];
}

function isSaved(id) {
  return getSavedIds().includes(id);
}

function toggleSave(id) {
  const saved = getSavedIds();
  const index = saved.indexOf(id);
  if (index === -1) {
    saved.push(id);
    localStorage.setItem(SAVED_KEY, JSON.stringify(saved));
    return true;
  } else {
    saved.splice(index, 1);
    localStorage.setItem(SAVED_KEY, JSON.stringify(saved));
    return false;
  }
}

function openSaved() {
  renderSavedGrid();
  document.getElementById('saved-page').style.display = 'block';
  document.body.style.overflow = 'hidden';
}

function closeSaved() {
  document.getElementById('saved-page').style.display = 'none';
  document.body.style.overflow = '';
}

function renderSavedGrid() {
  const grid = document.getElementById('saved-grid');
  const savedIds = getSavedIds();
  const allIdeas = getIdeas();
  const savedIdeas = allIdeas.filter(idea => savedIds.includes(idea.id));

  if (!savedIdeas.length) {
    grid.innerHTML = '<div class="empty" style="grid-column:1/-1; text-align:center; padding:40px 20px;"><span style="font-size:2.5rem; display:block; margin-bottom:10px;">⭐</span>مفيش أفكار محفوظة</div>';
    return;
  }

  grid.innerHTML = savedIdeas.map(idea => `
    <div class="idea-card" data-id="${idea.id}">
      <h3>${idea.title}</h3>
      <p class="desc">${idea.desc}</p>
      <div class="meta">
        <span class="tag tag-need">${idea.needLabel}</span>
        <span class="tag tag-loc">📍 ${idea.governorate}</span>
      </div>
      <div class="social">
        <span>👁️ ${idea.views}</span>
        <span>⭐ ${idea.saves}</span>
        <span>📤 ${idea.shares}</span>
      </div>
    </div>
  `).join('');
}

// ربط زر المحفوظات في الشريط السفلي
document.addEventListener('DOMContentLoaded', function() {
  setTimeout(function() {
    const navButtons = document.querySelectorAll('.bottom-nav button');
    navButtons.forEach(function(btn) {
      if (btn.dataset.page === 'saved') {

   if (btn.dataset.page === 'me') {

        };
      }

});


// ========== دالة حفظ الفكرة ==========
function handleSave(id) {
  const isNowSaved = toggleSave(id);
  toast(isNowSaved ? '⭐ اتحفظت للقعدة الجاية' : 'اتشالت من المحفوظات');
  closeDetail();
}
  
// ========== صفحة "أنا" ==========
function openMe() {

        <h2 style="margin:0 0 4px; font-size:1.3rem; font-weight:900; color:var(--text);">${myName}</h2>

// ========== إصلاحات خطوة 8 ==========
document.addEventListener('DOMContentLoaded', function() {
  setTimeout(function() {
    
    // 1. ربط زر "➕ إضافة" في الشريط السفلي
    const navAdd = document.querySelector('.bottom-nav button[data-page="add"]');
    if (navAdd) {
      navAdd.onclick = function(e) {
        e.preventDefault();
        openAdd();
      };
    }
    
    // 2. ربط زر "🔍" في الهيدر
    const headerSearch = document.querySelector('.header-icon');
    if (headerSearch) {
      headerSearch.onclick = function() {
        const sb = document.getElementById('search-box');
        if (sb) {
          const isVis = sb.style.display !== 'none';
          sb.style.display = isVis ? 'none' : 'block';
          if (!isVis) {
            sb.scrollIntoView({ behavior: 'smooth', block: 'center' });
            setTimeout(function() {
              const si = document.getElementById('search-input');
              if (si) si.focus();
            }, 400);
          }
        }
      };
    }
    
    // 3. حفظ اسم المستخدم لما يضيف فكرة
    const originalSubmitAdd = window.submitAdd;
    if (typeof originalSubmitAdd === 'function') {
      window.submitAdd = function() {
        const authorEl = document.getElementById('f-author');
        if (authorEl) {
          const author = authorEl.value.trim();
          if (author && author !== 'مجهول') {
            localStorage.setItem('afkario_my_name', author);
          }
        }
        return originalSubmitAdd.apply(this, arguments);
      };
    }
    
  }, 300);
});
</script>
