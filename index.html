<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>☕ مقهى الأفكار - واحد + واحد = مليون</title>
<meta name="description" content="اكتب فكرتك. ببلاش حد يشوفها. بـ9 جنيه تبقى رسمية.">
<meta name="theme-color" content="#4285F4">
<link rel="manifest" href="./manifest.json">
<link rel="icon" type="image/svg+xml" href="./icon.svg">
<link rel="apple-touch-icon" href="./icon.svg">

<style>
:root {
  --yellow:   #FBBC04;
  --blue:     #4285F4;
  --pink:     #FF4FCB;
  --orange:   #FF6D00;
  --gray:     #CBD5E1;
  --dark:     #4B5563;
  --black:    #1C1C1E;
  --white:    #FFFFFF;
  --bg:       #FAFAFA;
  --bg-soft:  #F5F5F7;
  --border:   #E5E7EB;
  --radius:   16px;
  --shadow:   0 1px 3px rgba(0,0,0,.05), 0 1px 2px rgba(0,0,0,.03);
}

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

html, body {
  margin: 0;
  padding: 0;
  background: var(--bg);
}

body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Tahoma, Arial, sans-serif;
  color: var(--black);
  direction: rtl;
  text-align: right;
  line-height: 1.6;
  min-height: 100vh;
  padding-bottom: 90px;
  font-size: 15px;
}

a { color: var(--blue); text-decoration: none; }
button { font-family: inherit; cursor: pointer; border: none; background: none; color: inherit; }
input, textarea, select { font-family: inherit; font-size: 15px; }
img { max-width: 100%; display: block; }

.wrap { max-width: 640px; margin: 0 auto; padding: 0 16px; }

/* ==================== HEADER ==================== */
.app-header {
  background: var(--white);
  border-bottom: 1px solid var(--border);
  padding: 14px 0;
  position: sticky;
  top: 0;
  z-index: 40;
}
.header-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
}
.logo-box {
  width: 40px;
  height: 40px;
  border-radius: 10px;
  overflow: hidden;
  flex-shrink: 0;
}
.logo-box svg { width: 100%; height: 100%; display: block; }
.brand-title {
  font-size: 1.1rem;
  font-weight: 800;
  color: var(--black);
  display: flex;
  align-items: center;
  gap: 8px;
}
.brand-title .ar { font-size: 1.05rem; }

/* ==================== HERO ==================== */
.hero {
  text-align: center;
  padding: 24px 0 16px;
}
.hero h1 {
  font-size: 1.6rem;
  font-weight: 900;
  color: var(--black);
  margin: 0 0 8px;
  line-height: 1.3;
}
.hero p {
  font-size: 0.95rem;
  color: var(--dark);
  margin: 0 0 4px;
}
.hero .slogan {
  display: inline-block;
  background: linear-gradient(135deg, var(--yellow), var(--orange));
  color: var(--white);
  padding: 6px 16px;
  border-radius: 20px;
  font-weight: 700;
  font-size: 0.9rem;
  margin-top: 8px;
}

/* ==================== BUTTONS ==================== */
.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  padding: 14px 20px;
  border-radius: 14px;
  font-size: 1rem;
  font-weight: 700;
  transition: transform .08s ease, opacity .2s;
  border: none;
}
.btn:active { transform: scale(.97); }
.btn-primary {
  background: linear-gradient(135deg, var(--blue), #2b6fd9);
  color: var(--white);
  box-shadow: 0 4px 12px rgba(66,133,244,.3);
}
.btn-secondary {
  background: var(--white);
  color: var(--black);
  border: 1.5px solid var(--border);
}
.btn-pink {
  background: linear-gradient(135deg, var(--pink), #e91e8c);
  color: var(--white);
  box-shadow: 0 4px 12px rgba(255,79,203,.3);
}
.btn-block { width: 100%; }
.btn-sm { padding: 10px 14px; font-size: 0.9rem; border-radius: 10px; }

/* ==================== ACTIONS ==================== */
.main-actions {
  display: flex;
  gap: 10px;
  margin: 16px 0;
}
.main-actions .btn { flex: 1; }

/* ==================== STATS ==================== */
.stats {
  display: flex;
  gap: 10px;
  margin: 16px 0;
}
.stat {
  flex: 1;
  background: var(--white);
  border-radius: var(--radius);
  padding: 14px 10px;
  text-align: center;
  box-shadow: var(--shadow);
  border: 1px solid var(--border);
}
.stat .num {
  font-size: 1.5rem;
  font-weight: 900;
  color: var(--blue);
}
.stat .lbl {
  font-size: 0.78rem;
  color: var(--dark);
  margin-top: 2px;
}

/* ==================== KHATERA ==================== */
.khatera {
  background: linear-gradient(135deg, #FFF8E1, #FFECB3);
  border-radius: var(--radius);
  padding: 16px 18px;
  margin: 16px 0;
  border: 1px solid #FFE082;
  position: relative;
}
.khatera .k-label {
  font-size: 0.8rem;
  font-weight: 800;
  color: var(--orange);
  margin-bottom: 6px;
}
.khatera .k-text {
  font-size: 1rem;
  color: var(--black);
  font-weight: 600;
  line-height: 1.6;
}
.khatera .k-link {
  display: inline-block;
  margin-top: 10px;
  color: var(--blue);
  font-weight: 700;
  font-size: 0.9rem;
}

/* ==================== SECTION TITLE ==================== */
.section-title {
  font-size: 1.05rem;
  font-weight: 800;
  color: var(--black);
  margin: 20px 0 10px;
  display: flex;
  align-items: center;
  gap: 6px;
}

/* ==================== SEARCH ==================== */
.search-bar {
  display: flex;
  gap: 8px;
  margin-bottom: 12px;
}
.search-bar input {
  flex: 1;
  padding: 13px 16px;
  border-radius: 14px;
  border: 1.5px solid var(--border);
  background: var(--white);
  font-size: 15px;
  color: var(--black);
}
.search-bar input:focus { outline: none; border-color: var(--blue); }

/* ==================== FILTERS ==================== */
.filters-toggle {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 10px 14px;
  background: var(--white);
  border-radius: 12px;
  border: 1.5px solid var(--border);
  font-weight: 700;
  color: var(--dark);
  margin-bottom: 10px;
}
.filters-toggle button {
  color: var(--blue);
  font-weight: 800;
  padding: 4px 10px;
}
.filters {
  display: none;
  background: var(--white);
  border-radius: var(--radius);
  padding: 14px;
  border: 1.5px solid var(--border);
  margin-bottom: 14px;
}
.filters.open { display: block; }
.filter-group { margin-bottom: 14px; }
.filter-group:last-child { margin-bottom: 0; }
.filter-group label {
  display: block;
  font-weight: 700;
  color: var(--dark);
  margin-bottom: 6px;
  font-size: 0.88rem;
}
.chip-row { display: flex; flex-wrap: wrap; gap: 6px; }
.chip {
  padding: 7px 12px;
  border-radius: 20px;
  background: var(--bg-soft);
  color: var(--dark);
  font-size: 0.82rem;
  font-weight: 600;
  border: 1.5px solid transparent;
  transition: all .15s;
}
.chip.active {
  background: var(--blue);
  color: var(--white);
  border-color: var(--blue);
}
</style>
</head>

<!-- Main -->
<main class="wrap">

  <!-- Hero -->
  <section class="hero">
    <h1>عندك فكرة؟<br>ما تسيبهاش في دماغك.</h1>
    <p>فكرتك ببلاش… نشرها بـ9 جنيه.</p>

  <!-- Main Actions -->
  <div class="main-actions">

    <a class="k-link" id="khatera-link" href="#">اقرأ المزيد →</a>
  </div>

  <!-- Search -->
  <div class="search-bar">
    <input type="text" id="search-input" placeholder="ابحث باسم أو وصف الفكرة...">
  </div>

  <!-- Filters -->
  <div class="filters-toggle">
    <span>🎛️ الفلاتر</span>
    <button id="toggle-filters">عرض</button>

  <div class="filters" id="filters">
    <div class="filter-group">
      <label>الاحتياج</label>

    </div>

      <label>التصنيف</label>
      <div class="chip-row" id="filter-cat"></div>
    </div>
  </div>

  <!-- Ideas List -->
  <h2 class="section-title">☕ الأفكار اللي وصلت</h2>
  <div id="ideas-list"></div>

</main>

<style>
.modal {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,.5);
  z-index: 100;
  display: none;
  align-items: flex-end;
  justify-content: center;
}
.modal.open { display: flex; }
.modal-sheet {
  background: var(--bg);
  width: 100%;
  max-width: 640px;
  max-height: 92vh;
  overflow-y: auto;
  border-top-left-radius: 24px;
  border-top-right-radius: 24px;
  padding: 20px 18px 30px;
  animation: slideUp .25s ease;
  position: relative;
}
@keyframes slideUp {
  from { transform: translateY(30px); opacity: 0; }
  to   { transform: translateY(0); opacity: 1; }
}
.modal-close {
  width: 36px;
  height: 36px;
  border-radius: 50%;
  background: var(--bg-soft);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 1rem;
  font-weight: 800;
  color: var(--dark);
  position: absolute;
  top: 14px;
  left: 14px;
}
.modal-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 16px;
  position: relative;
}
.modal-head h2 {
  margin: 0;
  font-size: 1.15rem;
  color: var(--black);
}
.modal-head .modal-close { position: static; }

.idea-card {
  background: var(--white);
  border-radius: var(--radius);
  padding: 16px;
  margin-bottom: 12px;
  border: 1px solid var(--border);
  box-shadow: var(--shadow);
  cursor: pointer;
}
.idea-card h3 {
  margin: 0 0 6px;
  font-size: 1.05rem;
  color: var(--black);
  font-weight: 800;
  line-height: 1.4;
}
.idea-card .desc {
  color: var(--dark);
  font-size: 0.9rem;
  margin-bottom: 10px;
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
  overflow: hidden;
  line-height: 1.5;
}
.idea-meta {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  margin-bottom: 10px;
}
.tag {
  display: inline-flex;
  align-items: center;
  gap: 3px;
  padding: 4px 10px;
  border-radius: 20px;
  font-size: 0.75rem;
  font-weight: 700;
  background: var(--bg-soft);
  color: var(--dark);
}
.tag.need { background: #FFF3CD; color: #856404; }
.tag.cat  { background: #D1FAE5; color: #065F46; }
.tag.loc  { background: #EDE9FE; color: #5B21B6; }
.tag.amount { background: #FEF3C7; color: #92400E; }

.bottom-nav {
  position: fixed;
  bottom: 0;
  left: 0;
  right: 0;
  background: var(--white);
  border-top: 1px solid var(--border);
  display: flex;
  justify-content: space-around;
  padding: 8px 0 max(8px, env(safe-area-inset-bottom));
  z-index: 50;
}
.bottom-nav button {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 2px;
  color: var(--dark);
  font-size: 0.7rem;
  padding: 6px 4px;
  font-weight: 700;
}
.bottom-nav button.active { color: var(--blue); }
.bottom-nav .ic { font-size: 1.25rem; line-height: 1; }

.toast {
  position: fixed;
  bottom: 90px;
  left: 50%;
  transform: translateX(-50%) translateY(20px);
  background: var(--black);
  color: var(--white);
  padding: 12px 20px;
  border-radius: 24px;
  font-size: 0.9rem;
  font-weight: 600;
  z-index: 500;
  opacity: 0;
  transition: opacity .25s, transform .25s;
  pointer-events: none;
  max-width: 90vw;
  text-align: center;
}
.toast.show {
  opacity: 1;
  transform: translateX(-50%) translateY(0);
}

.empty {
  text-align: center;
  padding: 40px 20px;
  color: var(--dark);
}
.empty .big {
  font-size: 2.5rem;
  display: block;
  margin-bottom: 10px;
}

.detail-block {
  background: var(--white);
  border-radius: 14px;
  padding: 14px 16px;
  margin-bottom: 10px;
  border: 1px solid var(--border);
}
.detail-block h4 {
  margin: 0 0 6px;
  font-size: 0.9rem;
  color: var(--dark);
  font-weight: 800;
}
.detail-block p {
  margin: 0;
  font-size: 0.95rem;
  color: var(--black);
  white-space: pre-wrap;
  line-height: 1.6;
}
.detail-hero {
  text-align: center;
  padding: 8px 0 20px;
}
.detail-hero h2 {
  font-size: 1.35rem;
  font-weight: 900;
  color: var(--black);
  margin: 0 0 10px;
  line-height: 1.35;
}
.detail-actions {
  display: flex;
  flex-direction: column;
  gap: 8px;
  margin-top: 16px;
}
.detail-actions .row { display: flex; gap: 8px; }
.detail-actions .row .btn { flex: 1; }
</style>

const $  = (s, el = document) => el.querySelector(s);
const $$ = (s, el = document) => [...el.querySelectorAll(s)];
const uid = () => 'id_' + Date.now().toString(36) + Math.random().toString(36).slice(2, 7);

function escapeHtml(s) {
  if (s == null) return '';
  return String(s)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
}

function toast(msg) {
  const t = $('#toast');
  if (!t) return;
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(t._timer);
  t._timer = setTimeout(() => t.classList.remove('show'), 2500);
}

function labelOf(list, id) {
  const item = list.find(x => x.id === id);
  return item ? item.label : (id || '—');
}
function needLabel(id) { return labelOf(NEEDS, id); }
function catLabel(id)  { return labelOf(CATEGORIES, id); }

function waLink(number, msg) {
  const n = String(number || '').replace(/\D/g, '');
  return 'https://wa.me/' + n + '?text=' + encodeURIComponent(msg || '');
}

const LS = {
  ideas:    'afkario_ideas',
  saved:    'afkario_saved',
  khaterat: 'afkario_khaterat',
  me:       'afkario_me'
};

function getIdeas() {
  try { return JSON.parse(localStorage.getItem(LS.ideas)) || []; } catch { return []; }
}
function saveIdeas(arr) { localStorage.setItem(LS.ideas, JSON.stringify(arr)); }
function getSaved() {
  try { return JSON.parse(localStorage.getItem(LS.saved)) || []; } catch { return []; }
}
function toggleSaved(id) {
  const s = getSaved();
  const i = s.indexOf(id);
  if (i === -1) s.push(id); else s.splice(i, 1);
  localStorage.setItem(LS.saved, JSON.stringify(s));
  return i === -1;
}
function isSaved(id) { return getSaved().includes(id); }
function getKhaterat() {
  try { return JSON.parse(localStorage.getItem(LS.khaterat)) || []; } catch { return []; }
}
function getLatestKhatera() {
  const all = getKhaterat().filter(k => k.published);
  if (!all.length) return null;
  return all.sort((a, b) => new Date(b.date) - new Date(a.date))[0];
}
function getMe() {
  try { return JSON.parse(localStorage.getItem(LS.me)) || null; } catch { return null; }
}
function saveMe(me) { localStorage.setItem(LS.me, JSON.stringify(me)); }

    { id: uid(), title: 'مشروع زراعة أسطح', desc: 'استغلال أسطح المباني في زراعة خضروات.', type: 'idea', need: 'help', category: 'agriculture', governorate: 'القاهرة', city: 'شبرا', amount: null, whatsapp: '201000000006', showWhatsapp: true, author: 'كريم', fullDesc: 'استغلال أسطح العمارات في زراعة خضروات عضوية وبيعها.', status: 'published', createdAt: now - 6*864e5 },
    { id: uid(), title: 'رحلات سياحية داخلية', desc: 'رحلات سياحية للشباب داخل مصر.', type: 'project', need: 'funding', category: 'tourism', governorate: 'الأقصر', city: 'الأقصر', amount: 60000, whatsapp: '201000000007', showWhatsapp: true, author: 'ياسمين', fullDesc: 'تنظيم رحلات سياحية للشباب بأسعار في متناول الجميع.', status: 'published', createdAt: now - 7*864e5 },
    { id: uid(), title: 'خدمة تنظيف منازل', desc: 'شركة تنظيف بفريق مدرب ومنتجات آمنة.', type: 'project', need: 'funding_or_partner', category: 'services', governorate: 'القاهرة', city: 'مصر الجديدة', amount: 40000, whatsapp: '201000000008', showWhatsapp: false, author: 'نهى', fullDesc: 'شركة تنظيف بفريق مدرب ومنتجات آمنة على الأطفال.', status: 'published', createdAt: now - 8*864e5 }
  ];
  saveIdeas(demo);
  localStorage.setItem(LS.khaterat, JSON.stringify([
    { id: uid(), text: 'مش لازم فكرتك تكون عبقرية… المهم إنها موجودة.', date: new Date(now - 864e5).toISOString(), published: true },
    { id: uid(), text: 'واحد + واحد = ممكن مليون.', date: new Date(now - 2*864e5).toISOString(), published: true }
  ]));
}

const filters = { q: '', need: '', cat: '' };

function renderStats() {
  const ideas = getIdeas();
  const today = new Date().toDateString();
  const todayCount = ideas.filter(i => new Date(i.createdAt).toDateString() === today).length;
  $('#stat-total').textContent = ideas.length;
  $('#stat-today').textContent = todayCount;
  $('#stat-users').textContent = ideas.length;
}

function renderKhatera() {
  const k = getLatestKhatera();
  const box = $('#khatera-box');
  if (!k) { box.style.display = 'none'; return; }
  box.style.display = 'block';
  $('#khatera-text').textContent = k.text;
}

function renderChips() {
  $('#filter-need').innerHTML = '<button class="chip active" data-need="">الكل</button>' +
    NEEDS.map(n => `<button class="chip" data-need="${n.id}">${n.label}</button>`).join('');
  $('#filter-cat').innerHTML = '<button class="chip active" data-cat="">الكل</button>' +
    CATEGORIES.map(c => `<button class="chip" data-cat="${c.id}">${c.label}</button>`).join('');
}

function ideaCardHtml(idea) {
  return '<div class="idea-card" data-id="' + idea.id + '">' +
    '<.lengthh3>' +) escapeHtml(idea.title {
) + '</h3>'    +
    '<p class="desc"> box' + escapeHtml.innerHTML(idea.desc) + '</p>' +
    '<div class="idea-meta">' +
      '<span class="tag need">' + needLabel(idea.need) + '</span>' +
      '<span class="tag cat">' + catLabel(idea.category) + '</span>' +
      '<span class="tag loc">📍 ' + escapeHtml(idea.governorate) + '</span>' +
      (idea.amount ? '<span class="tag amount">💰 ' + idea.amount.toLocaleString('ar-EG') + ' ج</span>' : '') +
    '</div></div>';
}

function renderIdeas() {
  const all = getIdeas().filter(i => i.status === 'published').sort((a, b) => b.createdAt - a.createdAt);
  const list = all.filter(i => {
    if (filters.q) {
      const q = filters.q.toLowerCase();
      const hay = (i.title + ' ' + i.desc + ' ' + (i.fullDesc || '')).toLowerCase();
      if (!hay.includes(q)) return false;
    }
    if (filters.need && i.need !== filters.need) return false;
    if (filters.cat  && i.category !== filters.cat)  return false;
    return true;
  });
  const box = $('#ideas-list');
  if (!list = '<div class="empty"><span class="big">☕</span>مفيش أفكار مطابقة</div>';
    return;
  }
  box.innerHTML = list.map(ideaCardHtml).join('');
}

function renderAll() { renderStats(); renderKhatera(); renderChips(); renderIdeas(); }

function openDetail(id) {
  const idea = getIdeas().find(i => i.id === id);
  if (!idea) return;
  const saved = isSaved(id);
  const waNum = idea.showWhatsapp && idea.whatsapp ? idea.whatsapp : null;
  const waMsg = 'أهلاً، شوفت فكرتك على مقهى الأفكار وعايز أعرف عنها أكتر.';

  let html = '<div class="detail-hero"><h2>' + escapeHtml(idea.title) + '</h2>';
  html += '<div class="idea-meta" style="justify-content:center">';
  html += '<span class="tag need">' + needLabel(idea.need) + '</span>';
  html += '<span class="tag cat">' + catLabel(idea.category) + '</span>';
  html += '<span class="tag loc">📍 ' + escapeHtml(idea.governorate) + '</span>';
  if (idea.amount) html += '<span class="tag amount">💰 ' + idea.amount.toLocaleString('ar-EG') + ' ج</span>';
  html += '</div></div>';
  html += '<div class="detail-block"><h4>الوصف</h4><p>' + escapeHtml(idea.fullDesc || idea.desc) + '</p></div>';
  if (idea.author) html += '<div class="detail-block"><h4>صاحب الفكرة</h4><p>' + escapeHtml(idea.author) + '</p></div>';
  html += '<div class="detail-actions">';
  if (waNum) html += '<a class="btn btn-primary btn-block" href="' + waLink(waNum, waMsg) + '" target="_blank">📲 تواصل على واتساب</a>';
  html += '<button class="btn btn-secondary btn-block" id="detail-share">📤 شارك الفكرة</button>';
  html += '<div class="row">';
  html += '<button class="btn btn-secondary" id="detail-save">' + (saved ? '⭐ محفوظة' : '⭐ احفظ') + '</button>';
  html += '<button class="btn btn-secondary" id="detail-copy">🔗 نسخ الرابط</button>';
  html += '</div></div>';

  $('#detail-content').innerHTML = html;
  $('#modal-detail').classList.add('open');
  document.body.style.overflow = 'hidden';

  $('#detail-close').onclick = closeDetail;
  $('#detail-save').onclick = () => {
    const isNow = toggleSaved(id);
    $('#detail-save').textContent = isNow ? '⭐ محفوظة' : '⭐ احفظ';
    toast(isNow ? '⭐ اتحفظت' : 'اتشالت');
  };
  $('#detail-copy').onclick = async () => {
    const url = location.origin + location.pathname + '#idea=' + id;
    try { await navigator.clipboard.writeText(url); toast('🔗 اتنسخ'); } catch { prompt('انسخ:', url); }
  };
  $('#detail-share').onclick = async () => {
    const url = location.origin + location.pathname + '#idea=' + id;
    const text = '💡 شوف الفكرة دي على مقهى الأفكار\n' + url;
    if (navigator.share) { try { await navigator.share({ title: idea.title, text, url }); } catch {} }
    else { window.open('https://wa.me/?text=' + encodeURIComponent(text), '_blank'); }
  };
}

function closeDetail() {
  $('#modal-detail').classList.remove('open');
  document.body.style.overflow = '';
}

  CATEGORIES.forEach(c => { html += '<option value="' + c.id + '">' + c.label + '</option>'; });

  html += '<div style="margin-bottom:14px"><label style="font-weight:700;display:block;margin-bottom:6px">رقم واتساب (اختياري)</label><input id="w-wa" type="tel" placeholder="201xxxxxxxxx" style="width:100%;padding:13px;border-radius:12px;border:1.5px solid var(--border)"></div>';
  html += '<div style="margin-bottom:20px"><label style="display:flex;align-items:center;gap:8px;font-weight:600;font-size:.9rem"><input id="w-show-wa" type="checkbox" style="width:auto"> موافق على عرض الرقم للعامة</label></div>';
  html += '<div style="background:linear-gradient(135deg,#FFF8E1,#FFECB3);border-radius:14px;padding:16px;margin-bottom:16px;text-align:center"><div style="font-size:.85rem;font-weight:800;color:var(--orange);margin-bottom:4px">⚠️ الدفع التجريبي</div><div style="font-size:2rem;font-weight:900;color:var(--black)">9<span style="font-size:1rem"> جنيه</span></div></div>';

  $('#wizard-body').innerHTML = html;
  $('#modal-add').classList.add('open');
  document.body.style.overflow = 'hidden';

  $('#wizard-close').onclick = closeAdd;
  $('#w-submit').onclick = () => {
    const title = $('#w-title').value.trim();

function closeAdd() {
  $('#modal-add').classList.remove('open');
  document.body.style.overflow = '';
}

function showSaved() {
  const saved = getSaved();
  const ideas = getIdeas().filter(i => saved.includes(i.id));
  const title = document.querySelector('.section-title');
  if (title) title.textContent = '⭐ المحفوظات';

  if (!ideas.length) {
    box.innerHTML = '<div class="empty"><span class="big">⭐</span>مفيش أفكار محفوظة</div>';

  }
  box.innerHTML = ideas.map(ideaCardHtml).join('');
  window.scrollTo({ top: 400, behavior: 'smooth' });
}

function showMe() {
  const me = getMe();
  const title = document.querySelector('.section-title');
  if (title) title.textContent = '👤 أنا';
  const box = $('#ideas-list');
  if (!me) {
    box.innerHTML = '<div class="empty"><span class="big">👤</span>لسه مفيش حساب. اكتب فكرة الأول.</div>';
    return;
  }
  const mine = getIdeas().filter(i => i.author === me.author);
  let html = '<div class="detail-block"><h4>الاسم</h4><p>' + escapeHtml(me.author) + '</p></div>';
  if (me.whatsapp) html += '<div class="detail-block"><h4>واتساب</h4><p>' + escapeHtml(me.whatsapp) + '</p></div>';
  html += '<div class="section-title" style="margin-top:20px">📝 أفكاري (' + mine.length + ')</div>';
  html += mine.map(ideaCardHtml).join('');
  box.innerHTML = html;
  window.scrollTo({ top: 400, behavior: 'smooth' });
}

function init() {
  seedDemo();
  renderAll();

  $('#btn-add').onclick = openAdd;
  $('#btn-search').onclick = () => {
    $('#search-input').scrollIntoView({ behavior: 'smooth', block: 'center' });
    setTimeout(() => $('#search-input').focus(), 400);
  };

  $('#search-input').addEventListener('input', (e) => {
    filters.q = e.target.value.trim();
    renderIdeas();
  });

  $('#toggle-filters').onclick = () => {
    const f = $('#filters');
    f.classList.toggle('open');
    $('#toggle-filters').textContent = f.classList.contains('open') ? 'إخفاء' : 'عرض';
  };

  document.addEventListener('click', (e) => {
    const chip = e.target.closest('.chip');
    if (!chip) return;
    if (chip.dataset.need !== undefined) {
      $$('#filter-need .chip').forEach(c => c.classList.remove('active'));
      chip.classList.add('active');
      filters.need = chip.dataset.need;
      renderIdeas();
    }
    if (chip.dataset.cat !== undefined) {
      $$('#filter-cat .chip').forEach(c => c.classList.remove('active'));
      chip.classList.add('active');
      filters.cat = chip.dataset.cat;
      renderIdeas();
    }
  });

  document.addEventListener('click', (e) => {
    const card = e.target.closest('.idea-card');
    if (card && !e.target.closest('.btn')) openDetail(card.dataset.id);
  });

  
  $('#modal-detail').addEventListener('click', (e) => {
    if (e.target.id === 'modal-detail') closeDetail();
  });
  $('#modal-add').addEventListener('click', (e) => {
    if (e.target.id === 'modal-add') closeAdd();
  });

  $$('.bottom-nav button').forEach(b => {
    b.onclick = () => {
      if (b.dataset.page === 'home') window.scrollTo({ top: 0, behavior: 'smooth' });
      else if (b.dataset.page === 'saved') showSaved();
      else if (b.dataset.page === 'me') showMe();
      $$('.bottom-nav button').forEach(x => x.classList.remove('active'));
      b.classList.add('active');
    };
  });

  if (location.hash.startsWith('#idea=')) {
    const id = location.hash.slice(6);
    setTimeout(() => openDetail(id), 300);
  }
}

if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('./sw.js').catch(() => {});
  });
}

document.addEventListener('DOMContentLoaded', init);
</script>
